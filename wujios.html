<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="only light">
  <title>WujiOS</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/components.css">
  <style>
    :root {
      --statusbar-h: 26px;
      color-scheme: only light;
    }

    html {
      font-size: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    * {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    *::-webkit-scrollbar {
      display: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--wj-font);
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: none;
      -moz-text-size-adjust: none;
      text-size-adjust: none;
      background: #000;
      color: #fff;
    }

    .os {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: auto;
      background: url('./themes/sea.png') center center / cover no-repeat;
    }

    .statusbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: var(--statusbar-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px 0 14px;
      padding-right: 34px;
      font-size: var(--wj-fs-xs);
      font-weight: 600;
      background: linear-gradient(to bottom,
          rgba(255, 255, 255, .55) 0%,
          rgba(255, 255, 255, .25) 60%,
          rgba(255, 255, 255, 0) 100%);
      color: #000;
      z-index: 60;
      pointer-events: none;
      opacity: 1;
      transition: opacity .25s, color .25s, background .25s, text-shadow .25s;
      text-shadow: none;
    }

    .os[data-view="locked"] .statusbar,
    .os:not([data-power="running"]) .statusbar {
      opacity: 0;
    }

    .os.cc-open .statusbar {
      background: transparent;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    }

    .statusbar .right {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .battery {
      position: relative;
      width: 22px;
      height: 11px;
      padding: 1px;
      border: 1px solid currentColor;
      border-radius: 3px;
      color: inherit;
      opacity: .9;
    }

    .battery::after {
      content: "";
      position: absolute;
      right: -3.5px;
      top: 50%;
      transform: translateY(-50%);
      width: 2px;
      height: 5px;
      background: currentColor;
      border-radius: 0 2px 2px 0;
    }

    .battery i {
      display: block;
      height: 100%;
      width: 72%;
      background: currentColor;
      border-radius: 1.5px;
    }

    .view {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      opacity: 0;
      visibility: hidden;
      transition: none;
    }

    .view--locked {
      top: 0;
      z-index: 5;
    }

    .view--home {
      top: var(--statusbar-h);
      z-index: 1;
    }

    .view--app {
      top: 0;
      z-index: 10;
    }

    .os:not([data-power="running"]) .view {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    .os[data-view="locked"] .view--locked {
      opacity: 1;
      visibility: visible;
    }

    .os[data-view="home"] .view--home,
    .os[data-view="app"] .view--home {
      visibility: visible;
      opacity: 1;
    }

    .os[data-view="app"] .view--app {
      opacity: 1;
      visibility: visible;
    }

    .view--locked {
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 16%;
      color: #1c2536;
      will-change: transform, opacity;
      touch-action: none;
      text-align: center;
      overflow: hidden;
    }

    .lock-content {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity .25s ease, transform .25s ease;
    }

    .lock-content.is-hidden {
      opacity: 0;
      transform: scale(.96);
      pointer-events: none;
    }

    .lock-time {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .lock-time__hour,
    .lock-time__min {
      display: block;
      margin: 0 auto;
      text-align: center;
      font-size: 96px;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1;
      font-family: 'Consolas', monospace;
      background: linear-gradient(180deg,
          rgba(255, 255, 255, 0.7) 0%,
          rgba(255, 255, 255, 0.6) 6%,
          rgba(255, 255, 255, 0.58) 18%,
          rgba(255, 255, 255, 0.55) 40%,
          rgba(255, 255, 255, 0.4) 62%,
          rgba(255, 255, 255, 0.55) 82%,
          rgba(255, 255, 255, 0.6) 96%,
          rgba(255, 255, 255, 0.7) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      filter:
        drop-shadow(0 -1px 0.5px rgba(255, 255, 255, 1)) drop-shadow(0 1px 0.5px rgba(30, 50, 80, 0.55)) drop-shadow(0 2px 1px rgba(30, 50, 80, 0.35)) drop-shadow(0 6px 14px rgba(30, 50, 80, 0.35)) drop-shadow(0 14px 32px rgba(30, 50, 80, 0.22));
    }

    .lock-time__min {
      margin-top: 8px;
      opacity: .98;
    }

    .lock-date {
      margin-top: 26px;
      font-size: var(--wj-fs-md);
      color: #ffffff;
      letter-spacing: .5px;
      text-shadow:
        0 1px 2px rgba(40, 60, 90, 0.55),
        0 4px 12px rgba(40, 60, 90, 0.4);
    }

    .password-panel {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: 8% 6% 5%;
      background: rgba(20, 30, 50, 0.5);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
      opacity: 0;
      visibility: hidden;
      transition: opacity .28s ease, visibility .28s ease;
      z-index: 10;
    }

    .password-panel.is-open {
      opacity: 1;
      visibility: visible;
    }

    .password-header {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .password-title {
      font-size: 15px;
      font-weight: 500;
      color: #fff;
      letter-spacing: 1px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, .4);
      transition: color .2s ease;
      min-height: 20px;
    }

    .password-title.is-error {
      color: #ffb8c6;
    }

    .password-dots {
      display: flex;
      gap: 18px;
    }

    .password-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.9);
      background: transparent;
      transition: background .15s ease, transform .15s ease;
    }

    .password-dot.is-filled {
      background: #fff;
      transform: scale(1.15);
    }

    .lock-pin-pad {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 200px;
      margin: auto auto 0;
    }

    .lock-pin-key {
      aspect-ratio: 1;
      width: 100%;
      border: 0.5px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      font: inherit;
      font-size: 24px;
      font-weight: 400;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .12s, transform .08s;
      -webkit-tap-highlight-color: transparent;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .lock-pin-key:active {
      transform: scale(.94);
      background: rgba(255, 255, 255, 0.42);
    }

    .lock-pin-key--empty {
      visibility: hidden;
      pointer-events: none;
    }

    .lock-pin-key--action {
      font-size: 22px;
    }

    .view--home {
      background: transparent;
      will-change: transform, opacity;
    }

    .desktop-viewport {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 28px;
      overflow: hidden;
      touch-action: pan-y;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .desktop-track {
      display: flex;
      height: 100%;
      will-change: transform;
    }

    .desktop-page {
      flex: 0 0 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 12px 10px 18px;
      overflow: hidden;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .desktop-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: repeat(4, minmax(0, 1fr));
      gap: 4px 2px;
      width: 100%;
      height: 100%;
      min-width: 0;
    }

    .slot {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      transition: background .15s;
      min-width: 0;
      min-height: 0;
    }

    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 4px 0;
      border-radius: 14px;
      cursor: pointer;
      transition: background .15s, transform .1s;
      -webkit-tap-highlight-color: transparent;
      width: 100%;
      min-width: 0;
      max-width: 100%;
    }

    .app[data-dragging="1"] {
      opacity: 0;
    }

    .app,
    .app * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
      -khtml-user-drag: none;
      -moz-user-drag: none;
      -o-user-drag: none;
    }

    .desktop-ghost,
    .desktop-ghost * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none !important;
    }

    .desktop-ghost {
      position: fixed;
      pointer-events: none;
      z-index: 900;
      transform: scale(1.12);
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, .35));
      opacity: .95;
      will-change: left, top;
    }

    .desktop-drag-preview {
      position: fixed;
      pointer-events: none;
      z-index: 850;
      opacity: .38;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 4px 0;
      border-radius: 14px;
      will-change: left, top, width, height;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, .2));
    }

    .desktop-drag-preview .app__icon {
      max-width: 52px;
    }

       .app-menu {
      position: fixed;
      z-index: 1000;
      background: rgba(255, 255, 255, .72);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: .5px solid rgba(255, 255, 255, .55);
      border-radius: 14px;
      box-shadow:
        0 12px 40px rgba(0, 0, 0, .16),
        0 2px 8px rgba(0, 0, 0, .06);
      padding: 6px;
      min-width: 140px;
      animation: appMenuIn .16s cubic-bezier(.2, .7, .3, 1);
      user-select: none;
      -webkit-user-select: none;
    }

    .app-menu__item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 12px 14px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #e0356b;
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: background .12s;
      -webkit-tap-highlight-color: transparent;
    }

    .app-menu__item:active {
      background: rgba(224, 53, 107, .12);
    }

    .app-menu__icon {
      flex: 0 0 18px;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e0356b;
    }

    .app-menu__icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    @keyframes appMenuIn {
      from { opacity: 0; transform: scale(.9); }
      to   { opacity: 1; transform: scale(1); }
    }

    .page-dots {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 5;
      pointer-events: auto;
    }

    .page-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .5);
      box-shadow: 0 1px 2px rgba(0, 0, 0, .35);
      cursor: pointer;
      transition: background .2s, transform .2s;
    }

    .page-dot.is-active {
      background: #fff;
      transform: scale(1.4);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .5);
    }

    .app__icon {
      width: 100%;
      max-width: 52px;
      aspect-ratio: 1;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      line-height: 1;
      background: var(--wj-icon-bg, transparent);
      overflow: hidden;
    }

    .app__icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
    }

    .app__name {
      font-size: var(--wj-fs-xs);
      color: #ffffff;
      letter-spacing: .2px;
      text-shadow: 0 1px 2px rgba(40, 60, 90, 0.55);
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .app-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: var(--wj-bg);
      color: var(--wj-text);
      will-change: transform;
      transition: none;
      touch-action: auto;
    }

    .app-page {
      box-shadow: -14px 0 36px rgba(0, 0, 0, .3);
    }

    .app-body {
      flex: 1 1 auto;
      padding: var(--wj-pad);
      padding-top: calc(var(--wj-pad) + var(--statusbar-h));
      overflow-y: auto;
      font-size: var(--wj-fs-md);
      line-height: 1.65;
      color: var(--wj-text-muted);
      height: 100%;
    }

    .power-overlay {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: opacity .35s, visibility .35s;
    }

    .os[data-power="off"] .power-overlay--off,
    .os[data-power="booting"] .power-overlay--boot,
    .os[data-power="shuttingdown"] .power-overlay--shutdown {
      opacity: 1;
      visibility: visible;
    }

    .os[data-power="booting"] .power-overlay--boot,
    .os[data-power="shuttingdown"] .power-overlay--shutdown {
      transition: none;
    }

    .boot-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    .boot-stage.no-anim,
    .boot-stage.no-anim * {
      transition: none !important;
    }

    .boot-mark {
      display: inline-flex;
      align-items: baseline;
      font-size: 42px;
      font-weight: 600;
      letter-spacing: 2px;
      line-height: 1;
      color: #fff;
      white-space: nowrap;
    }

    .boot-i {
      display: inline-block;
      width: .28em;
      overflow: hidden;
      transition: width .55s cubic-bezier(.2, .7, .3, 1), opacity .35s ease;
    }

    .boot-mark.stage-2 .boot-i {
      opacity: 0;
    }

    .boot-mark.stage-3 .boot-i {
      width: 0;
      opacity: 0;
    }

    .boot-os {
      display: inline-block;
      width: 0;
      overflow: hidden;
      opacity: 0;
      transition: width .55s cubic-bezier(.2, .7, .3, 1), opacity .4s ease .15s;
    }

    .boot-mark.stage-3 .boot-os {
      width: 1.55em;
      opacity: 1;
    }

    .boot-powered {
      position: absolute;
      left: 50%;
      bottom: -38vh;
      transform: translateX(-50%);
      font-size: 10px;
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: 0.5px;
      text-align: center;
      color: #ffffff;
      white-space: nowrap;
      opacity: 0;
      transition: opacity .7s ease .3s;
      pointer-events: none;
      user-select: none;
    }

    .boot-mark.stage-3~.boot-powered {
      opacity: 1;
    }

    .boot-stage.no-anim .boot-powered {
      transition: none !important;
      opacity: 0;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, .15);
      border-top-color: #8ad4ff;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .shutdown-text {
      font-size: var(--wj-fs-md);
      color: rgba(255, 255, 255, .5);
    }

    .off-hint {
      font-size: var(--wj-fs-md);
      color: rgba(255, 255, 255, .35);
      letter-spacing: 2.5px;
    }

    .cc-backdrop {
      position: absolute;
      inset: 0;
      z-index: 49;
      background: rgba(12, 18, 36, 0.28);
      backdrop-filter: blur(4px) saturate(140%);
      -webkit-backdrop-filter: blur(4px) saturate(140%);
      opacity: 0;
      transition: opacity .35s cubic-bezier(.2, .7, .3, 1);
      pointer-events: none;
      will-change: opacity;
      transform: translateZ(0);
    }

    .os.cc-open .cc-backdrop {
      opacity: 1;
    }

    .control-center {
      position: absolute;
      inset: 0;
      padding: 44px 14px 34px;
      box-sizing: border-box;
      background: transparent;
      transform: translateY(-100%);
      transition: transform .35s cubic-bezier(.2, .7, .3, 1);
      z-index: 50;
      overflow: hidden;
      touch-action: none;
      will-change: transform;
    }

    .control-center::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 12% 6%, rgba(120, 160, 255, 0.20), transparent 55%),
        radial-gradient(circle at 90% 94%, rgba(160, 120, 255, 0.16), transparent 55%),
        radial-gradient(circle at 88% 10%, rgba(100, 190, 255, 0.10), transparent 45%);
      pointer-events: none;
      z-index: 0;
    }

    .cc-handle {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.42);
      z-index: 2;
    }

    .cc-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: 56px 56px 56px;
      gap: 9px;
      width: 100%;
    }

    .cc-slider-card {
      position: relative;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.10);
      overflow: hidden;
      cursor: ns-resize;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      isolation: isolate;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 16px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.14),
        0 6px 18px rgba(0, 0, 0, 0.18);
    }

    .cc-slider-fill {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 60%;
      background: #ffffff;
      transition: height .06s linear;
      z-index: 0;
    }

    .cc-slider-icon {
      position: relative;
      z-index: 1;
      width: 20px;
      height: 20px;
      color: #ffffff;
      mix-blend-mode: difference;
      pointer-events: none;
    }

    .cc-slider-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .cc-slider-card[data-slider="volume"] {
      grid-column: 1;
      grid-row: 1 / span 2;
    }

    .cc-slider-card[data-slider="brightness"] {
      grid-column: 2;
      grid-row: 1 / span 2;
    }

    .cc-toggle {
      position: relative;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      font: inherit;
      cursor: pointer;
      overflow: hidden;
      transition: transform .1s ease, box-shadow .25s ease;
      -webkit-tap-highlight-color: transparent;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.10),
        0 6px 18px rgba(0, 0, 0, 0.14);
    }

    .cc-toggle:active {
      transform: scale(.96);
    }

    .cc-toggle .cc-icon {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;

  <script>
    const ICONS = {
      volume: `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
    </svg>`,
      brightness: `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
    </svg>`,
      wifi: `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
      <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
      <line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>`,
      bluetooth: `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.5 6.5l11 11L12 23V1l5.5 5.5-11 11"/>
    </svg>`,
      rocket: `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
      <path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
      <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
      <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
    </svg>`,
      cellular: `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 22h.01"/>
      <path d="M7 22v-4"/>
      <path d="M12 22V12"/>
      <path d="M17 22V6"/>
      <path d="M22 22V2"/>
    </svg>`,
    };

    document.querySelectorAll('[data-icon]').forEach(el => {
      const name = el.dataset.icon;
      if (ICONS[name]) el.innerHTML = ICONS[name];
    });

    const osEl = document.getElementById('os');
    const lockedView = document.getElementById('lockedView');
    const homeView = document.getElementById('homeView');
    const appView = document.getElementById('appView');
    const appScreen = document.getElementById('appScreen');

    const S = {
      view: 'locked',
      currentBundle: null,
      power: 'off',
      viewBeforeLock: 'home',
    };

    let currentNav = null;
    let currentBackHandler = null;

    const sleep = ms => new Promise(r => setTimeout(r, ms));

    function setView(v) {
      S.view = v;
      osEl.dataset.view = v;
    }
    function setPower(p) {
      S.power = p;
      osEl.dataset.power = p;
      notifyParent('statechange', { state: p });
    }
    function notifyParent(event, payload) {
      if (window.parent !== window) {
        try { window.parent.postMessage({ type: 'iwuji:event', event, payload }, '*'); } catch { }
      }
    }

    (function startClock() {
      const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const tick = () => {
        const d = new Date();
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');

        document.getElementById('clock').textContent = `${d.getHours()}:${mm}`;
        document.getElementById('lockHour').textContent = hh;
        document.getElementById('lockMin').textContent = mm;
        document.getElementById('lockDate').textContent =
          `${d.getMonth() + 1}月${d.getDate()}日 ${days[d.getDay()]}`;
      };
      tick();
      setInterval(tick, 15000);
    })();

    const desktopViewportEl = document.getElementById('desktopViewport');
    const desktopTrackEl = document.getElementById('desktopTrack');
    const pageDotsEl = document.getElementById('pageDots');

    let currentPage = 0;

    const PAGE_SWITCH_MS = 220;
    const PAGE_EASE = 'cubic-bezier(.22,.61,.36,1)';

    function renderIcon(app) {
      const icon = app.icon || '';
      if (/^(https?:|data:|\.{1,2}\/|\/)/.test(icon)) {
        return `<img src="${icon}" alt="" draggable="false">`;
      }
      return `<span>${icon}</span>`;
    }

    function updatePageDots() {
      const total = Math.max(1, DesktopLayout.pageCount());
      if (currentPage >= total) currentPage = total - 1;
      if (currentPage < 0) currentPage = 0;

      let html = '';
      for (let i = 0; i < total; i++) {
        html += `<div class="page-dot${i === currentPage ? ' is-active' : ''}" data-page-index="${i}"></div>`;
      }
      pageDotsEl.innerHTML = html;
    }

    function renderHome() {
      const pages = DesktopLayout.snapshot();

      desktopTrackEl.innerHTML = pages.map((page, pi) => `
    <div class="desktop-page" data-page-index="${pi}">
      <div class="desktop-grid">
        ${page.slots.map((item, si) => {
        if (!item) {
          return `<div class="slot is-empty"
                         data-page-index="${pi}"
                         data-slot-index="${si}"></div>`;
        }
        const { bundle, meta } = item;
        return `
            <div class="slot" data-page-index="${pi}" data-slot-index="${si}">
              <div class="app" data-bundle="${bundle}">
                <div class="app__icon" style="${meta.iconStyle || ''}">${renderIcon(meta)}</div>
                <div class="app__name">${meta.name}</div>
              </div>
            </div>
          `;
      }).join('')}
      </div>
    </div>
  `).join('');

      const total = pages.length;
      if (currentPage >= total) currentPage = total - 1;
      if (currentPage < 0) currentPage = 0;

      const w = desktopViewportEl.offsetWidth;
      desktopTrackEl.style.transition = 'none';
      desktopTrackEl.style.transform = `translateX(${-currentPage * w}px)`;

      updatePageDots();
      bindAppGuards();
    }
    let _lastPointerOpenAt = 0;

    function bindAppGuards() {
      desktopViewportEl.querySelectorAll('.app').forEach(appEl => {
        if (appEl._guarded) return;
        appEl._guarded = true;

        appEl.addEventListener('touchstart', e => {
          if (e.cancelable) e.preventDefault();
        }, { passive: false });

        appEl.addEventListener('contextmenu', e => {
          e.preventDefault();
          return false;
        });

        appEl.addEventListener('pointerdown', e => {
          appEl._px = e.clientX;
          appEl._py = e.clientY;
        }, { passive: true });

        appEl.addEventListener('pointerup', e => {
          if (e.pointerType === 'mouse' && e.button !== 0) return;
          if (DesktopDrag.state === 'dragging') return;
          if (performance.now() < DesktopDrag.suppressClickUntil) return;

          const dx = Math.abs(e.clientX - (appEl._px ?? 0));
          const dy = Math.abs(e.clientY - (appEl._py ?? 0));
          if (dx > 12 || dy > 12) return;

          _lastPointerOpenAt = performance.now();
          openApp(appEl.dataset.bundle, appEl);
        });
      });
    }

    function goToPage(index, animate = true) {
      const total = DesktopLayout.pageCount();
      index = Math.max(0, Math.min(index, total - 1));
      currentPage = index;

      const w = desktopViewportEl.offsetWidth;
      const x = -index * w;

      if (animate) {
        desktopTrackEl.style.transition = `transform ${PAGE_SWITCH_MS}ms ${PAGE_EASE}`;
        void desktopTrackEl.offsetWidth;
      } else {
        desktopTrackEl.style.transition = 'none';
      }
      desktopTrackEl.style.transform = `translateX(${x}px)`;

      updatePageDots();
    }

    pageDotsEl.addEventListener('click', e => {
      const dot = e.target.closest('.page-dot');
      if (!dot) return;
      goToPage(+dot.dataset.pageIndex);
    });

    (function bindPageSwipe() {
      let pointerState = null;

      desktopViewportEl.addEventListener('pointerdown', e => {
        if (DesktopDrag.state === 'dragging') return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;

        pointerState = {
          startX: e.clientX,
          startY: e.clientY,
          startOffset: -currentPage * desktopViewportEl.offsetWidth,
          dx: 0,
          locked: null,
          pointerId: e.pointerId,
          captured: false,
        };
        desktopTrackEl.style.transition = 'none';
      });

      desktopViewportEl.addEventListener('pointermove', e => {
        if (!pointerState) return;
        if (e.pointerId !== pointerState.pointerId) return;

        if (DesktopDrag.state === 'dragging') {
          pointerState = null;
          return;
        }

        const dx = e.clientX - pointerState.startX;
        const dy = e.clientY - pointerState.startY;

        if (!pointerState.locked) {
          if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
          pointerState.locked = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
          if (pointerState.locked === 'v') return;

          if (!pointerState.captured) {
            try {
              desktopViewportEl.setPointerCapture(e.pointerId);
              pointerState.captured = true;
            } catch { }
          }
        }
        if (pointerState.locked !== 'h') return;

        if (e.cancelable) e.preventDefault();

        let x = pointerState.startOffset + dx;
        const minX = -(DesktopLayout.pageCount() - 1) * desktopViewportEl.offsetWidth;

        if (x > 0) x = x * 0.35;
        if (x < minX) x = minX + (x - minX) * 0.35;

        desktopTrackEl.style.transform = `translateX(${x}px)`;
        pointerState.dx = dx;
      });

      desktopViewportEl.addEventListener('pointerup', e => {
        if (!pointerState) return;
        if (e.pointerId !== pointerState.pointerId) return;

        if (pointerState.locked === 'h') {
          const w = desktopViewportEl.offsetWidth;
          const dx = pointerState.dx;
          const threshold = w / 4;
          const total = DesktopLayout.pageCount();

          if (dx < -threshold && currentPage < total - 1) {
            goToPage(currentPage + 1);
          } else if (dx > threshold && currentPage > 0) {
            goToPage(currentPage - 1);
          } else {
            goToPage(currentPage);
          }
        }
        pointerState = null;
      });

      desktopViewportEl.addEventListener('pointercancel', e => {
        if (!pointerState) return;
        if (e.pointerId !== pointerState.pointerId) return;
        if (pointerState.locked === 'h') goToPage(currentPage);
        pointerState = null;
      });
    })();

    const DesktopDrag = (() => {
      const HOLD_MS = 300;
      const UNINSTALL_HOLD_MS = 700;     /* 长按弹菜单的总时长 */
      const MOVE_CANCEL = 14;
      const EDGE_ZONE = 44;
      const EDGE_HOLD_MS = 600;
      const EDGE_REPEAT_MS = 900;
      const SUPPRESS_MS = 300;
      const WATCHDOG_MS = 20000;

      let state = 'idle';
      let pressTimer = null;
      let pressStart = null;
      let draggedBundle = null;
      let draggedFrom = null;
      let ghostEl = null;
      let sourceEl = null;
      let edgeTimer = null;
      let edgeDir = 0;
      let edgeFirstFired = false;
      let shieldEl = null;
      let previewEl = null;
      let activePointerId = null;
      let watchdogTimer = null;
      let longPressMenuTimer = null;     /* 长按菜单计时器 */

      let suppressClickUntil = 0;

      function createShield() {
        shieldEl = document.createElement('div');
        shieldEl.style.cssText =
          'position:fixed;inset:0;z-index:9999;background:transparent;touch-action:none;';
        const stop = ev => { if (ev.cancelable) ev.preventDefault(); };
        shieldEl.addEventListener('touchstart', stop, { passive: false });
        shieldEl.addEventListener('touchmove', stop, { passive: false });
        shieldEl.addEventListener('contextmenu', stop);
        document.body.appendChild(shieldEl);
      }

      function destroyShield() {
        if (shieldEl) { shieldEl.remove(); shieldEl = null; }
      }

      function startDrag(x, y, appEl) {
        state = 'dragging';
        draggedBundle = appEl.dataset.bundle;
        draggedFrom = DesktopLayout.findBundle(draggedBundle);
        sourceEl = appEl;
        appEl.dataset.dragging = '1';

        if (activePointerId !== null) {
          try { desktopViewportEl.setPointerCapture(activePointerId); } catch { }
        }

        const rect = appEl.getBoundingClientRect();
        ghostEl = appEl.cloneNode(true);
        ghostEl.classList.add('desktop-ghost');
        ghostEl.removeAttribute('data-dragging');
        ghostEl.style.left = rect.left + 'px';
        ghostEl.style.top = rect.top + 'px';
        ghostEl.style.width = rect.width + 'px';
        ghostEl.style.height = rect.height + 'px';
        document.body.appendChild(ghostEl);

        moveGhost(x, y);
        suppressClickUntil = performance.now() + SUPPRESS_MS;
        createPreview(appEl);
        createShield();

        clearTimeout(watchdogTimer);
        watchdogTimer = setTimeout(() => {
          if (state === 'dragging') finishDrag(x, y);
        }, WATCHDOG_MS);
      }

      function moveGhost(x, y) {
        if (!ghostEl) return;
        const w = ghostEl.offsetWidth;
        const h = ghostEl.offsetHeight;
        ghostEl.style.left = (x - w / 2) + 'px';
        ghostEl.style.top = (y - h / 2) + 'px';
      }

      function createPreview(appEl) {
        destroyPreview();
        previewEl = appEl.cloneNode(true);
        previewEl.classList.add('desktop-drag-preview');
        previewEl.removeAttribute('data-dragging');
        previewEl.removeAttribute('data-bundle');
        previewEl.style.display = 'none';
        document.body.appendChild(previewEl);
      }

      function destroyPreview() {
        if (previewEl) {
          previewEl.remove();
          previewEl = null;
        }
      }

      function updatePreview(slotEl) {
        if (!previewEl) return;
        if (!slotEl) {
          previewEl.style.display = 'none';
          return;
        }
        const r = slotEl.getBoundingClientRect();
        previewEl.style.display = '';
        previewEl.style.left = r.left + 'px';
        previewEl.style.top = r.top + 'px';
        previewEl.style.width = r.width + 'px';
        previewEl.style.height = r.height + 'px';
      }

      function pickSlotAt(x, y) {
        const stack = document.elementsFromPoint(x, y);
        for (let i = 0; i < stack.length; i++) {
          const el = stack[i];
          if (el === shieldEl || el === previewEl || el === ghostEl) continue;
          const slot = el.closest ? el.closest('.slot') : null;
          if (slot) return slot;
        }
        return null;
      }

      function checkEdge(x) {
        const w = window.innerWidth;
        let dir = 0;
        if (x < EDGE_ZONE) dir = -1;
        else if (x > w - EDGE_ZONE) dir = 1;

        if (dir === 0) {
          if (edgeTimer) { clearTimeout(edgeTimer); edgeTimer = null; }
          edgeDir = 0;
          edgeFirstFired = false;
          return;
        }

        if (dir !== edgeDir) {
          edgeDir = dir;
          edgeFirstFired = false;
          if (edgeTimer) clearTimeout(edgeTimer);
          scheduleEdgeFlip(dir);
        }
      }

      function scheduleEdgeFlip(dir) {
        const delay = edgeFirstFired ? EDGE_REPEAT_MS : EDGE_HOLD_MS;

        edgeTimer = setTimeout(() => {
          edgeTimer = null;
          if (state !== 'dragging') return;
          if (edgeDir !== dir) return;

          const flipped = doPageFlip(dir);
          edgeFirstFired = true;

          if (flipped) {
            scheduleEdgeFlip(dir);
          }
        }, delay);
      }

      function doPageFlip(dir) {
        const total = DesktopLayout.pageCount();

        if (dir === 1) {
          if (currentPage < total - 1) {
            goToPage(currentPage + 1);
            return true;
          }
          if (DesktopLayout.isPageEmpty(total - 1)) return false;

          DesktopLayout.addPage();
          const newIndex = total;

          currentPage = total - 1;
          renderHome();
          syncDragSource();

          requestAnimationFrame(() => {
            goToPage(newIndex);
          });
          return true;
        }

        if (dir === -1) {
          if (currentPage > 0) {
            goToPage(currentPage - 1);
            return true;
          }
          if (DesktopLayout.isPageEmpty(0)) return false;

          DesktopLayout.addPageAt(0);
          currentPage = 1;
          renderHome();
          syncDragSource();

          requestAnimationFrame(() => {
            goToPage(0);
          });
          return true;
        }

        return false;
      }

      function releasePointer() {
        if (activePointerId !== null) {
          try { desktopViewportEl.releasePointerCapture(activePointerId); } catch { }
        }
        activePointerId = null;
      }

      function syncDragSource() {
        if (state !== 'dragging' || !draggedBundle) return;
        const el = desktopViewportEl.querySelector(
          `.app[data-bundle="${draggedBundle}"]`
        );
        if (el) {
          el.dataset.dragging = '1';
          sourceEl = el;
        } else {
          sourceEl = null;
        }
      }

      function clearEdge() {

      document.body.appendChild(menu);

      const GAP = 8;
      const EDGE = 8;
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      let left = anchorRect.right + GAP;
      if (left + menuRect.width > vw - EDGE) {
        left = anchorRect.left - menuRect.width - GAP;
      }
      if (left < EDGE) left = EDGE;
      if (left + menuRect.width > vw - EDGE) {
        left = vw - EDGE - menuRect.width;
      }

      let top = anchorRect.top + anchorRect.height / 2 - menuRect.height / 2;
      top = Math.max(EDGE, Math.min(top, vh - menuRect.height - EDGE));

        const rect = osEl.getBoundingClientRect();
        if ((e.clientY - rect.top) < 30 && (e.clientX - rect.left) / rect.width >= 0.5) return;

        dragging = true;
        startY = e.clientY;
        deltaY = 0;
        pointerId = e.pointerId;
        hasPassword = !!Store.get('lock.password', '');

        const target = S.viewBeforeLock === 'app' && S.currentBundle ? 'app' : 'home';

        if (!hasPassword) {
          if (target === 'app') appView.style.setProperty('visibility', 'visible');
          homeView.style.setProperty('visibility', 'visible');
          homeView.style.setProperty('opacity', '0');
        }

        lockedView.style.transition = 'none';
      }, { passive: true });

      lockedView.addEventListener('pointermove', e => {
        if (!dragging) return;
        if (pointerId !== null && e.pointerId !== pointerId) return;

        const dy = e.clientY - startY;
        if (dy >= 0) { deltaY = 0; return; }

        if (e.cancelable) e.preventDefault();
        deltaY = dy;

        if (hasPassword) {
          const damp = dy * 0.12;
          const p = Math.min(-dy / 300, 1);
          lockedView.style.transform = `translateY(${damp}px)`;
          lockedView.style.opacity = String(1 - p * 0.25);
        } else {
          const p = Math.min(-dy / 120, 1);
          lockedView.style.transform = `translateY(${dy}px)`;
          lockedView.style.opacity = String(1 - p * 0.65);
          homeView.style.opacity = String(p);
        }
      }, { passive: false });

      function endDrag(e) {
        if (!dragging) return;
        if (e && pointerId !== null && e.pointerId !== pointerId) return;
        dragging = false;
        pointerId = null;

        const target = S.viewBeforeLock === 'app' && S.currentBundle ? 'app' : 'home';
        const unlocked = -deltaY > 70;

        if (hasPassword) {
          lockedView.style.transition = 'transform .22s ease, opacity .22s ease';
          lockedView.style.transform = '';
          lockedView.style.opacity = '';

          setTimeout(() => {
            lockedView.style.transition = '';
            if (unlocked) showPasswordPanel();
          }, 200);

          deltaY = 0;
          return;
        }

        if (unlocked) {
          completeUnlock(target);
        } else {
          lockedView.style.transition = 'transform .26s ease, opacity .26s ease';
          homeView.style.transition = 'opacity .26s ease';
          lockedView.style.transform = '';
          lockedView.style.opacity = '';
          homeView.style.opacity = '0';

          setTimeout(() => {
            lockedView.style.transition = '';
            homeView.style.transition = '';
            homeView.style.opacity = '';
            homeView.style.removeProperty('visibility');
            appView.style.removeProperty('visibility');
          }, 280);
        }
        deltaY = 0;
      }

      lockedView.addEventListener('pointerup', endDrag);
      lockedView.addEventListener('pointercancel', endDrag);
    })();

    (function bindAppGesture() {
      let dragging = false;
      let startX = 0, startY = 0;
      let deltaX = 0;
      let dir = null;
      let navDragging = false;

      function beginGesture(x, y) {
        if (S.view !== 'app') return false;
        const rect = osEl.getBoundingClientRect();
        if ((y - rect.top) < 30 && (x - rect.left) / rect.width >= 0.5) return false;

        dragging = true;
        navDragging = false;
        startX = x;
        startY = y;
        deltaX = 0;
        dir = null;
        appScreen.style.transition = 'none';
        return true;
      }

      function moveGesture(x, y, preventFn) {
        if (!dragging) return;
        const dx = x - startX;
        const dy = y - startY;

        if (!dir) {
          if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
          dir = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';

          if (dir === 'h') {
            if (currentNav && currentNav.depth > 1) {
              navDragging = currentNav.dragStart();
            }
          } else {
            dragging = false;
            return;
          }
        }
        if (dir !== 'h') return;

        if (preventFn) preventFn();

        if (dx <= 0) {
          deltaX = 0;
          if (navDragging) currentNav.dragMove(0);
          else appScreen.style.transform = '';
          return;
        }

        deltaX = dx;

        if (navDragging) {
          currentNav.dragMove(dx);
          appScreen.style.transform = '';
        } else {
          appScreen.style.transform = `translateX(${dx}px)`;
        }
      }

      function endGesture() {
        if (!dragging) return;
        dragging = false;

        if (deltaX === 0) {
          appScreen.style.transition = 'none';
          appScreen.style.transform = '';
          if (navDragging) { currentNav.dragCancel(); navDragging = false; }
          dir = null;
          return;
        }

        const w = appView.offsetWidth;
        const threshold = w * 0.25;

        if (navDragging) {
          currentNav.dragEnd(deltaX, 0.25);
          navDragging = false;
          appScreen.style.transition = 'none';
          appScreen.style.transform = '';
        } else if (deltaX > threshold) {
          if (currentBackHandler && currentBackHandler()) {
            appScreen.style.transition = 'transform .26s cubic-bezier(.4,0,.6,1)';
            appScreen.style.transform = '';
          } else {
            appScreen.style.transition = 'transform .26s cubic-bezier(.4,0,.6,1)';
            appScreen.style.transform = `translateX(${w}px)`;
            setTimeout(finishCloseApp, 260);
          }
        } else {
          appScreen.style.transition = 'transform .24s ease';
          appScreen.style.transform = '';
          setTimeout(() => { appScreen.style.transition = 'none'; }, 240);
        }
        deltaX = 0;
        dir = null;
      }

      appScreen.addEventListener('touchstart', e => {
        if (e.target.tagName === 'IFRAME') return;
        const t = e.touches[0];
        if (!t) return;
        beginGesture(t.clientX, t.clientY);
      }, { passive: true });

      appScreen.addEventListener('touchmove', e => {
        if (e.target.tagName === 'IFRAME') return;
        const t = e.touches[0];
        if (!t) return;
        moveGesture(t.clientX, t.clientY, () => {
          if (e.cancelable) e.preventDefault();
        });
      }, { passive: false });

      appScreen.addEventListener('touchend', endGesture);
      appScreen.addEventListener('touchcancel', endGesture);

      appScreen.addEventListener('pointerdown', e => {
        if (e.pointerType !== 'mouse') return;
        if (e.button !== 0) return;
        if (e.target.tagName === 'IFRAME') return;
        beginGesture(e.clientX, e.clientY);
      });

      appScreen.addEventListener('pointermove', e => {
        if (e.pointerType !== 'mouse') return;
        if (e.target.tagName === 'IFRAME') return;
        moveGesture(e.clientX, e.clientY, null);
      });

      appScreen.addEventListener('pointerup', e => {
        if (e.pointerType !== 'mouse') return;
        endGesture();
      });

      appScreen.addEventListener('pointercancel', e => {
        if (e.pointerType !== 'mouse') return;
        endGesture();
      });
    })();

    async function playBootAnimation() {
      const T = { show1: 2000, fadeI: 500, expandOS: 400, hold: 2200 };

      const stage = document.getElementById('bootStage');
      const mark = document.getElementById('bootMark');

      stage.classList.add('no-anim');
      mark.className = 'boot-mark';
      void stage.offsetWidth;
      stage.classList.remove('no-anim');

      await sleep(T.show1);
      mark.classList.add('stage-2');
      await sleep(T.fadeI);
      mark.classList.add('stage-3');
      await sleep(T.expandOS);
      await sleep(T.hold);
    }

    async function powerOn() {
      if (S.power !== 'off') return;
      setPower('booting');

      await playBootAnimation();

      hidePasswordPanel();
      WujiControlCenter.close();

      lockedView.style.transition = '';
      lockedView.style.transform = '';
      lockedView.style.opacity = '';
      homeView.style.transition = '';
      homeView.style.transform = '';
      homeView.style.opacity = '';
      homeView.style.removeProperty('visibility');
      appView.style.removeProperty('visibility');
      appScreen.style.transition = 'none';
      appScreen.style.transform = '';

      S.viewBeforeLock = 'home';
      setView('locked');
      setPower('running');
    }

    async function powerOff() {
      if (S.power !== 'running' && S.power !== 'booting') return;
      setPower('shuttingdown');
      Store.set('lastShutdownAt', Date.now());
      await sleep(800);

      hidePasswordPanel();
      WujiControlCenter.close();
      S.viewBeforeLock = 'home';
      setView('locked');
      setPower('off');
    }

    async function restart() {
      await powerOff();
      await sleep(300);
      await powerOn();
    }

    window.addEventListener('message', e => {
      const d = e.data;
      if (!d || d.type !== 'iwuji:control') return;

      switch (d.action) {
        case 'power-on': powerOn(); break;
        case 'power-off': powerOff(); break;
        case 'restart': restart(); break;

        case 'sleep':
          if (S.power === 'running') {
            S.viewBeforeLock = S.view === 'app' ? 'app' : 'home';
            hidePasswordPanel();
            WujiControlCenter.close();
            setView('locked');
          }
          break;

        case 'wake':
          if (S.power === 'running') setView('locked');
          break;

        case 'clear-data':
          Store.reset();
          DesktopLayout.reset();
          DesktopLayout.seedFromRegistry();
          currentPage = 0;
          renderHome();
          if (S.power === 'off') powerOn();
          else restart();
          break;

        case 'volume-change':
          if (typeof d.payload?.volume === 'number') {
            WujiControlCenter.setVolume(d.payload.volume);
          }
          break;
      }
    });

    (function enableMouseDragScroll() {
      const THRESHOLD = 6;
      const FRICTION = 0.94;
      const MIN_V = 0.02;

      let scroller = null;
      let startX = 0, startY = 0;
      let startScrollTop = 0, startScrollLeft = 0;
      let dragging = false;
      let lastY = 0, lastT = 0, velocityY = 0;
      let momentumRAF = null;
      let blockClickUntil = 0;

      function findScroller(el) {
        while (el && el !== document.body) {
          if (el.nodeType === 1) {
            const style = getComputedStyle(el);
            const canY = /(auto|scroll)/.test(style.overflowY)
              && el.scrollHeight > el.clientHeight + 1;
            const canX = /(auto|scroll)/.test(style.overflowX)
              && el.scrollWidth > el.clientWidth + 1;
            if (canY || canX) return el;
          }

          if (el.parentElement) {
            el = el.parentElement;
          } else {
            const root = el.getRootNode?.();
            el = (root && root.host) ? root.host : null;
          }
        }
        return null;
      }

      function realTargetOf(e) {
        if (typeof e.composedPath === 'function') {
          const path = e.composedPath();
          for (let i = 0; i < path.length; i++) {
            if (path[i] && path[i].nodeType === 1) return path[i];
          }
        }
        return e.target;
      }

      document.addEventListener('pointerdown', e => {
        if (e.pointerType !== 'mouse') return;
        if (e.button !== 0) return;
        if (DesktopDrag.state === 'dragging') return;

        const real = realTargetOf(e);
        if (!real || real.nodeType !== 1) return;

        if (real.tagName === 'IFRAME') return;
        if (real.closest('button, a, input, textarea, select, label, [contenteditable]')) return;

        const sc = findScroller(real);
        if (!sc) return;

        if (momentumRAF) { cancelAnimationFrame(momentumRAF); momentumRAF = null; }

        scroller = sc;
        startX = e.clientX;
        startY = e.clientY;
        startScrollTop = sc.scrollTop;
        startScrollLeft = sc.scrollLeft;
        dragging = false;
        lastY = e.clientY;
        lastT = performance.now();
        velocityY = 0;
      });

      document.addEventListener('pointermove', e => {
        if (!scroller) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        if (!dragging && Math.hypot(dx, dy) > THRESHOLD) {
          dragging = true;
          scroller.style.cursor = 'grabbing';
        }
        if (!dragging) return;

        scroller.scrollTop = startScrollTop - dy;
        scroller.scrollLeft = startScrollLeft - dx;

        const now = performance.now();
        const dt = now - lastT;
        if (dt > 0) {
          velocityY = (e.clientY - lastY) / dt;
          lastY = e.clientY;
          lastT = now;
        }

        e.preventDefault();
      }, { passive: false });

      function endDrag() {
        if (!scroller) return;
        const sc = scroller;
        const wasDragging = dragging;

        sc.style.cursor = '';
        scroller = null;
        dragging = false;

        if (wasDragging) blockClickUntil = performance.now() + 120;

        if (wasDragging && Math.abs(velocityY) > MIN_V) {
          let v = velocityY;
          const step = () => {
            v *= FRICTION;
            sc.scrollTop -= v * 16;
            if (Math.abs(v) > MIN_V) {
              momentumRAF = requestAnimationFrame(step);
            } else {
              momentumRAF = null;
            }
          };
          momentumRAF = requestAnimationFrame(step);
        }
      }

      document.addEventListener('pointerup', endDrag);
      document.addEventListener('pointercancel', endDrag);

      document.addEventListener('click', e => {
        if (performance.now() < blockClickUntil) {
          e.stopPropagation();
          e.preventDefault();
        }
      }, true);
    })();

    (function disableContextMenu() {
      document.addEventListener('contextmenu', e => {
        e.preventDefault();
        return false;
      }, { capture: true });

      document.addEventListener('dragstart', e => {
        e.preventDefault();
        return false;
      }, { capture: true });

      document.addEventListener('selectstart', e => {
        e.preventDefault();
        return false;
      }, { capture: true });
    })();

    WujiControlCenter.init({
      osEl,
      notifyParent,
    });

    WujiAppInstaller.restore();
    DesktopLayout.seedFromRegistry();
    renderHome();

    WujiApps.on(evt => {
      if (evt.type === 'unregistered') {
        DesktopLayout.removeApp(evt.bundle);
        renderHome();
      } else if (evt.type === 'registered') {
        DesktopLayout.seedFromRegistry();
        renderHome();
      }
    });

    window.addEventListener('resize', () => {
      const w = desktopViewportEl.offsetWidth;
      desktopTrackEl.style.transition = 'none';
      desktopTrackEl.style.transform = `translateX(${-currentPage * w}px)`;
    });

    notifyParent('statechange', { state: S.power });
  </script>

</body>
