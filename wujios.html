<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="only light">
  <title>WujiOS</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/os.css">
</head>

<body>

  <div class="os" id="os" data-view="locked" data-power="off">
    <div class="statusbar">
      <span class="statusbar__left">
        <span id="clock">9:41</span>
        <span class="statusbar-notif-icons" id="statusbarNotifIcons" hidden></span>
      </span>
      <span class="right">
        <span>5G</span>
        <span class="battery"><i></i></span>
      </span>
    </div>

    <div class="view view--locked" id="lockedView">
      <div class="lock-content" id="lockContent">
        <div class="lock-time">
          <span class="lock-time__hour" id="lockHour">09</span>
          <span class="lock-time__sep" aria-hidden="true">:</span>
          <span class="lock-time__min" id="lockMin">41</span>
        </div>
        <div class="lock-date" id="lockDate">10月12日 星期一</div>
      </div>

      <div class="password-panel" id="passwordPanel">
        <div class="password-header">
          <div class="password-title" id="passwordTitle">输入密码</div>
          <div class="password-dots" id="passwordDots">
            <span class="password-dot"></span>
            <span class="password-dot"></span>
            <span class="password-dot"></span>
            <span class="password-dot"></span>
          </div>
        </div>

        <div class="lock-pin-pad" id="lockPinPad">
          <button class="lock-pin-key" data-digit="1">1</button>
          <button class="lock-pin-key" data-digit="2">2</button>
          <button class="lock-pin-key" data-digit="3">3</button>
          <button class="lock-pin-key" data-digit="4">4</button>
          <button class="lock-pin-key" data-digit="5">5</button>
          <button class="lock-pin-key" data-digit="6">6</button>
          <button class="lock-pin-key" data-digit="7">7</button>
          <button class="lock-pin-key" data-digit="8">8</button>
          <button class="lock-pin-key" data-digit="9">9</button>
          <button class="lock-pin-key lock-pin-key--empty" disabled></button>
          <button class="lock-pin-key" data-digit="0">0</button>
          <button class="lock-pin-key lock-pin-key--action" data-action="backspace">⌫</button>
        </div>
      </div>
    </div>

    <div class="view view--home" id="homeView">
      <div class="desktop-viewport" id="desktopViewport">
        <div class="desktop-track" id="desktopTrack"></div>
      </div>
      <div class="page-dots" id="pageDots"></div>
    </div>

    <div class="view view--app" id="appView">
      <div class="app-screen" id="appScreen"></div>
    </div>

    <!-- ============ PanelSystem ============ -->
    <div class="panel-backdrop" id="panelBackdrop"></div>
    <div class="panel-system" id="panelSystem">
      <div class="panel-track" id="panelTrack">

        <!-- 通知中心 -->
        <div class="panel-pane panel-pane--nc" id="panelNC">
          <div class="nc-head">
            <div class="nc-clock-block">
              <div class="nc-clock" id="ncClock">9:41</div>
              <div class="nc-date" id="ncDate">10月12日 星期一</div>
            </div>

            <button class="nc-clear" id="ncClearBtn" type="button" hidden aria-label="清除全部">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M3 6h18" />
                <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2" />
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                <path d="M10 11v6" />
                <path d="M14 11v6" />
              </svg>
            </button>
          </div>

          <div class="nc-list" id="ncList"></div>
          <div class="nc-empty" id="ncEmpty">无通知</div>

          <div class="panel-handle" aria-hidden="true"></div>
        </div>

        <!-- 控制中心 -->
        <div class="panel-pane panel-pane--cc" id="panelCC">
          <div class="cc-grid">
            <div class="cc-slider-card" data-slider="volume">
              <div class="cc-slider-fill" id="ccVolumeFill"></div>
              <div class="cc-slider-icon" data-icon="volume"></div>
            </div>
            <div class="cc-slider-card" data-slider="brightness">
              <div class="cc-slider-fill" id="ccBrightnessFill"></div>
              <div class="cc-slider-icon" data-icon="brightness"></div>
            </div>

            <button class="cc-toggle" data-key="wifi" type="button">
              <span class="cc-icon" data-icon="wifi"></span>
              <span class="cc-label">WLAN</span>
            </button>
            <button class="cc-toggle" data-key="bluetooth" type="button">
              <span class="cc-icon" data-icon="bluetooth"></span>
              <span class="cc-label">蓝牙</span>
            </button>
            <button class="cc-toggle" data-key="soundmode" type="button">
              <span class="cc-icon" data-icon="ring"></span>
              <span class="cc-label">响铃</span>
            </button>
            <button class="cc-toggle" data-key="cellular" type="button">
              <span class="cc-icon" data-icon="cellular"></span>
              <span class="cc-label">移动数据</span>
            </button>
          </div>

          <div class="panel-handle" aria-hidden="true"></div>
        </div>

      </div>
    </div>

    <div class="hw-volume-hud" id="hwVolumeHud" aria-hidden="true"><i></i></div>
    <div class="screen-off-overlay" id="screenOff" aria-hidden="true"></div>

    <div class="hw-menu-overlay" id="hwMenu">
      <div class="hw-menu-panel" id="hwMenuPanel"></div>
      <button class="hw-menu-close" id="hwMenuClose" type="button" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round">
          <line x1="6" y1="6" x2="18" y2="18"/>
          <line x1="18" y1="6" x2="6" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="power-overlay power-overlay--off">
      <div class="off-hint">按下电源键开机</div>
    </div>

    <div class="power-overlay power-overlay--boot">
      <div class="boot-stage" id="bootStage">
        <div class="boot-mark" id="bootMark">
          <span class="boot-i">i</span>
          <span class="boot-wuji">Wuji</span>
          <span class="boot-os">OS</span>
        </div>
        <div class="boot-powered">—Powered by—<br /><span
            style="font-weight: 500;font-size: 16px;letter-spacing: 0.2px;">OpenWuji</span>
        </div>
      </div>
    </div>

    <div class="power-overlay power-overlay--shutdown">
      <div class="shutdown-text">正在关机…</div>
    </div>

  </div>

  <script src="navigation.js"></script>
  <script src="core.js"></script>
  <script src="app-storage.js"></script>
  <script src="app-loader.js"></script>
  <script src="installer.js"></script>
  <script src="desktop-layout.js"></script>
  <script src="overlay.js"></script>
  <script src="notification.js"></script>
  <script src="control-center.js"></script>
  <script src="panelsystem.js"></script>
  <script src="dialog.js"></script>
  <script src="themes/store_themes.js"></script>
  <script src="theme.js"></script>
  <script src="builtin-apps.js"></script>

  <script>
    const ICONS = {
      volume: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
    </svg>`,
      brightness: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
    </svg>`,
      wifi: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
      <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
      <line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>`,
      bluetooth: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.5 6.5l11 11L12 23V1l5.5 5.5-11 11"/>
    </svg>`,
      rocket: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
      <path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
      <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
      <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
    </svg>`,
      cellular: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 22h.01"/>
      <path d="M7 22v-4"/>
      <path d="M12 22V12"/>
      <path d="M17 22V6"/>
      <path d="M22 22V2"/>
    </svg>`,
      ring: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2v2"/>
      <path d="M18 8.5A6 6 0 0 0 6 8.5c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>`,
      mute: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2v2"/>
      <path d="M18 8.5A6 6 0 0 0 6 8.5c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      <line x1="2" y1="2" x2="22" y2="22"/>
    </svg>`,
    };

    document.querySelectorAll('[data-icon]').forEach(el => {
      const name = el.dataset.icon;
      if (ICONS[name]) el.innerHTML = ICONS[name];
    });

    const osEl = document.getElementById('os');
    const lockedView = document.getElementById('lockedView');
    const homeView = document.getElementById('homeView');
    const appView = document.getElementById('appView');
    const appScreen = document.getElementById('appScreen');

    let _suppressClicksUntil = 0;

    const S = {
      view: 'locked',
      currentBundle: null,
      power: 'off',
      viewBeforeLock: 'home',
      screenOff: false,
    };

    let currentNav = null;
    let currentBackHandler = null;

    const sleep = ms => new Promise(r => setTimeout(r, ms));

    function setView(v) {
      S.view = v;
      osEl.dataset.view = v;
      try {
        WujiTheme.post('view', { view: v });
        if (v === 'locked') {
          WujiTheme.post('lock-enter', {});
        }
      } catch { }
    }
    function setPower(p) {
      S.power = p;
      osEl.dataset.power = p;
      try { WujiTheme.post('power', { state: p }); } catch { }
      notifyParent('statechange', { state: p });
    }
    function notifyParent(event, payload) {
      if (window.parent !== window) {
        try { window.parent.postMessage({ type: 'iwuji:event', event, payload }, '*'); } catch { }
      }
    }

    (function startClock() {
      const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const tick = () => {
        const d = new Date();
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');

        document.getElementById('clock').textContent = `${d.getHours()}:${mm}`;
        document.getElementById('lockHour').textContent = hh;
        document.getElementById('lockMin').textContent = mm;
        document.getElementById('lockDate').textContent =
          `${d.getMonth() + 1}月${d.getDate()}日 ${days[d.getDay()]}`;
      };
      tick();
      setInterval(tick, 15000);
    })();

    /* =========================================================
       桌面渲染
       ========================================================= */
    const desktopViewportEl = document.getElementById('desktopViewport');
    const desktopTrackEl = document.getElementById('desktopTrack');
    const pageDotsEl = document.getElementById('pageDots');

    let currentPage = 0;

    const PAGE_SWITCH_MS = 220;
    const PAGE_EASE = 'cubic-bezier(.22,.61,.36,1)';

    function renderIcon(app) {
      const icon = app.icon || '';
      if (/^(https?:|data:|\.{1,2}\/|\/)/.test(icon)) {
        return `<img src="${icon}" alt="" draggable="false">`;
      }
      return `<span>${icon}</span>`;
    }

    function updatePageDots() {
      const total = Math.max(1, DesktopLayout.pageCount());
      if (currentPage >= total) currentPage = total - 1;
      if (currentPage < 0) currentPage = 0;

      let html = '';
      for (let i = 0; i < total; i++) {
        html += `<div class="page-dot${i === currentPage ? ' is-active' : ''}" data-page-index="${i}"></div>`;
      }
      pageDotsEl.innerHTML = html;
    }

    function renderHome() {
      const pages = DesktopLayout.snapshot();

      desktopTrackEl.innerHTML = pages.map((page, pi) => `
    <div class="desktop-page" data-page-index="${pi}">
      <div class="desktop-grid">
        ${page.slots.map((item, si) => {
        if (!item) {
          return `<div class="slot is-empty"
                         data-page-index="${pi}"
                         data-slot-index="${si}"></div>`;
        }
        const { bundle, meta } = item;
        return `
            <div class="slot" data-page-index="${pi}" data-slot-index="${si}">
              <div class="app" data-bundle="${bundle}">
                <div class="app__icon" style="${meta.iconStyle || ''}">${renderIcon(meta)}</div>
                <div class="app__name">${meta.name}</div>
              </div>
            </div>
          `;
      }).join('')}
      </div>
    </div>
  `).join('');

      const total = pages.length;
      if (currentPage >= total) currentPage = total - 1;
      if (currentPage < 0) currentPage = 0;

      const w = desktopViewportEl.offsetWidth;
      desktopTrackEl.style.transition = 'none';
      desktopTrackEl.style.transform = `translateX(${-currentPage * w}px)`;

      updatePageDots();
      bindAppGuards();
    }
    let _lastPointerOpenAt = 0;

    function bindAppGuards() {
      desktopViewportEl.querySelectorAll('.app').forEach(appEl => {
        if (appEl._guarded) return;
        appEl._guarded = true;

        appEl.addEventListener('touchstart', e => {
          if (e.cancelable) e.preventDefault();
        }, { passive: false });

        appEl.addEventListener('contextmenu', e => {
          e.preventDefault();
          return false;
        });

        appEl.addEventListener('pointerdown', e => {
          appEl._px = e.clientX;
          appEl._py = e.clientY;
        }, { passive: true });

        appEl.addEventListener('pointerup', e => {
          if (e.pointerType === 'mouse' && e.button !== 0) return;
          if (DesktopDrag.state === 'dragging') return;
          if (performance.now() < DesktopDrag.suppressClickUntil) return;

          const dx = Math.abs(e.clientX - (appEl._px ?? 0));
          const dy = Math.abs(e.clientY - (appEl._py ?? 0));
          if (dx > 12 || dy > 12) return;

          _lastPointerOpenAt = performance.now();
          openApp(appEl.dataset.bundle, appEl, null);
        });
      });
    }

    function goToPage(index, animate = true) {
      const total = DesktopLayout.pageCount();
      index = Math.max(0, Math.min(index, total - 1));
      currentPage = index;

      const w = desktopViewportEl.offsetWidth;
      const x = -index * w;

      if (animate) {
        desktopTrackEl.style.transition = `transform ${PAGE_SWITCH_MS}ms ${PAGE_EASE}`;
        void desktopTrackEl.offsetWidth;
      } else {
        desktopTrackEl.style.transition = 'none';
      }
      desktopTrackEl.style.transform = `translateX(${x}px)`;

      updatePageDots();
    }

    pageDotsEl.addEventListener('click', e => {
      const dot = e.target.closest('.page-dot');
      if (!dot) return;
      goToPage(+dot.dataset.pageIndex);
    });

    (function bindPageSwipe() {
      let pointerState = null;

      desktopViewportEl.addEventListener('pointerdown', e => {
        if (DesktopDrag.state === 'dragging') return;
        if (window.WujiDialog?.isOpen) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;

        pointerState = {
          startX: e.clientX,
          startY: e.clientY,
          startOffset: -currentPage * desktopViewportEl.offsetWidth,
          dx: 0,
          locked: null,
          pointerId: e.pointerId,
          captured: false,
        };
        desktopTrackEl.style.transition = 'none';
      });

      desktopViewportEl.addEventListener('pointermove', e => {
        if (!pointerState) return;
        if (e.pointerId !== pointerState.pointerId) return;

        if (DesktopDrag.state === 'dragging') {
          pointerState = null;
          return;
        }

        const dx = e.clientX - pointerState.startX;
        const dy = e.clientY - pointerState.startY;

        if (!pointerState.locked) {
          if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
          pointerState.locked = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
          if (pointerState.locked === 'v') return;

          if (!pointerState.captured) {
            try {
              desktopViewportEl.setPointerCapture(e.pointerId);
              pointerState.captured = true;
            } catch { }
          }
        }
        if (pointerState.locked !== 'h') return;

        if (e.cancelable) e.preventDefault();

        let x = pointerState.startOffset + dx;
        const minX = -(DesktopLayout.pageCount() - 1) * desktopViewportEl.offsetWidth;

        if (x > 0) x = x * 0.35;
        if (x < minX) x = minX + (x - minX) * 0.35;

        desktopTrackEl.style.transform = `translateX(${x}px)`;
        pointerState.dx = dx;
      });

      desktopViewportEl.addEventListener('pointerup', e => {
        if (!pointerState) return;
        if (e.pointerId !== pointerState.pointerId) return;

        if (pointerState.locked === 'h') {
          const w = desktopViewportEl.offsetWidth;
          const dx = pointerState.dx;
          const threshold = w / 4;
          const total = DesktopLayout.pageCount();

          if (dx < -threshold && currentPage < total - 1) {
            goToPage(currentPage + 1);
          } else if (dx > threshold && currentPage > 0) {
            goToPage(currentPage - 1);
          } else {
            goToPage(currentPage);
          }
        }
        pointerState = null;
      });

      desktopViewportEl.addEventListener('pointercancel', e => {
        if (!pointerState) return;
        if (e.pointerId !== pointerState.pointerId) return;
        if (pointerState.locked === 'h') goToPage(currentPage);
        pointerState = null;
      });
    })();

    const DesktopDrag = (() => {
      const HOLD_MS = 400;
      const UNINSTALL_HOLD_MS = 1200;
      const MOVE_CANCEL = 14;
      const EDGE_ZONE = 44;
      const EDGE_HOLD_MS = 600;
      const EDGE_REPEAT_MS = 900;
      const SUPPRESS_MS = 300;
      const WATCHDOG_MS = 20000;

      let state = 'idle';
      let pressTimer = null;
      let pressStart = null;
      let draggedBundle = null;
      let draggedFrom = null;
      let ghostEl = null;
      let sourceEl = null;
      let edgeTimer = null;
      let edgeDir = 0;
      let edgeFirstFired = false;
      let shieldEl = null;
      let previewEl = null;
      let activePointerId = null;
      let watchdogTimer = null;
      let longPressMenuTimer = null;

      let suppressClickUntil = 0;

      function createShield() {
        shieldEl = document.createElement('div');
        shieldEl.style.cssText =
          'position:fixed;inset:0;z-index:9999;background:transparent;touch-action:none;';
        const stop = ev => { if (ev.cancelable) ev.preventDefault(); };
        shieldEl.addEventListener('touchstart', stop, { passive: false });
        shieldEl.addEventListener('touchmove', stop, { passive: false });
        shieldEl.addEventListener('contextmenu', stop);
        document.body.appendChild(shieldEl);
      }

      function destroyShield() {
        if (shieldEl) { shieldEl.remove(); shieldEl = null; }
      }

      function startDrag(x, y, appEl) {
        state = 'dragging';
        draggedBundle = appEl.dataset.bundle;
        draggedFrom = DesktopLayout.findBundle(draggedBundle);
        sourceEl = appEl;
        appEl.dataset.dragging = '1';

        if (activePointerId !== null) {
          try { desktopViewportEl.setPointerCapture(activePointerId); } catch { }
        }

        const rect = appEl.getBoundingClientRect();
        ghostEl = appEl.cloneNode(true);
        ghostEl.classList.add('desktop-ghost');
        ghostEl.removeAttribute('data-dragging');
        ghostEl.style.left = rect.left + 'px';
        ghostEl.style.top = rect.top + 'px';
        ghostEl.style.width = rect.width + 'px';
        ghostEl.style.height = rect.height + 'px';
        (document.getElementById('os') || document.body).appendChild(ghostEl);
        moveGhost(x, y);
        suppressClickUntil = performance.now() + SUPPRESS_MS;
        createPreview(appEl);
        createShield();

        clearTimeout(watchdogTimer);
        watchdogTimer = setTimeout(() => {
          if (state === 'dragging') finishDrag(x, y);
        }, WATCHDOG_MS);
      }

      function moveGhost(x, y) {
        if (!ghostEl) return;
        const w = ghostEl.offsetWidth;
        const h = ghostEl.offsetHeight;
        ghostEl.style.left = (x - w / 2) + 'px';
        ghostEl.style.top = (y - h / 2) + 'px';
      }

      function createPreview(appEl) {
        destroyPreview();
        previewEl = appEl.cloneNode(true);
        previewEl.classList.add('desktop-drag-preview');
        previewEl.removeAttribute('data-dragging');
        previewEl.removeAttribute('data-bundle');
        previewEl.style.display = 'none';
        (document.getElementById('os') || document.body).appendChild(ghostEl);
      }

      function destroyPreview() {
        if (previewEl) {
          previewEl.remove();
          previewEl = null;
        }
      }

      function updatePreview(slotEl) {
        if (!previewEl) return;
        if (!slotEl) {
          previewEl.style.display = 'none';
          return;
        }
        const r = slotEl.getBoundingClientRect();
        previewEl.style.display = '';
        previewEl.style.left = r.left + 'px';
        previewEl.style.top = r.top + 'px';
        previewEl.style.width = r.width + 'px';
        previewEl.style.height = r.height + 'px';
      }

      function pickSlotAt(x, y) {
        const stack = document.elementsFromPoint(x, y);
        for (let i = 0; i < stack.length; i++) {
          const el = stack[i];
          if (el === shieldEl || el === previewEl || el === ghostEl) continue;
          const slot = el.closest ? el.closest('.slot') : null;
          if (slot) return slot;
        }
        return null;
      }

      function checkEdge(x) {
        const w = window.innerWidth;
        let dir = 0;
        if (x < EDGE_ZONE) dir = -1;
        else if (x > w - EDGE_ZONE) dir = 1;

        if (dir === 0) {
          if (edgeTimer) { clearTimeout(edgeTimer); edgeTimer = null; }
          edgeDir = 0;
          edgeFirstFired = false;
          return;
        }

        if (dir !== edgeDir) {
          edgeDir = dir;
          edgeFirstFired = false;
          if (edgeTimer) clearTimeout(edgeTimer);
          scheduleEdgeFlip(dir);
        }
      }

      function scheduleEdgeFlip(dir) {
        const delay = edgeFirstFired ? EDGE_REPEAT_MS : EDGE_HOLD_MS;

        edgeTimer = setTimeout(() => {
          edgeTimer = null;
          if (state !== 'dragging') return;
          if (edgeDir !== dir) return;

          const flipped = doPageFlip(dir);
          edgeFirstFired = true;

          if (flipped) scheduleEdgeFlip(dir);
        }, delay);
      }

      function doPageFlip(dir) {
        const total = DesktopLayout.pageCount();

        if (dir === 1) {
          if (currentPage < total - 1) { goToPage(currentPage + 1); return true; }
          if (DesktopLayout.isPageEmpty(total - 1)) return false;

          DesktopLayout.addPage();
          const newIndex = total;
          currentPage = total - 1;
          renderHome();
          syncDragSource();
          requestAnimationFrame(() => goToPage(newIndex));
          return true;
        }

        if (dir === -1) {
          if (currentPage > 0) { goToPage(currentPage - 1); return true; }
          if (DesktopLayout.isPageEmpty(0)) return false;

          DesktopLayout.addPageAt(0);
          currentPage = 1;
          renderHome();
          syncDragSource();
          requestAnimationFrame(() => goToPage(0));
          return true;
        }

        return false;
      }

      function releasePointer() {
        if (activePointerId !== null) {
          try { desktopViewportEl.releasePointerCapture(activePointerId); } catch { }
        }
        activePointerId = null;
      }

      function syncDragSource() {
        if (state !== 'dragging' || !draggedBundle) return;
        const el = desktopViewportEl.querySelector(
          `.app[data-bundle="${draggedBundle}"]`
        );
        if (el) {
          el.dataset.dragging = '1';
          sourceEl = el;
        } else {
          sourceEl = null;
        }
      }

      function clearEdge() {
        if (edgeTimer) { clearTimeout(edgeTimer); edgeTimer = null; }
        edgeDir = 0;
      }

      function clearWatchdog() {
        clearTimeout(watchdogTimer);
        watchdogTimer = null;
      }

      function clearLongPressTimer() {
        if (longPressMenuTimer) {
          clearTimeout(longPressMenuTimer);
          longPressMenuTimer = null;
        }
      }

      function finishDrag(x, y) {
        if (state !== 'dragging') return;

        clearLongPressTimer();
        hideAppMenu();

        destroyShield();
        destroyPreview();

        if (ghostEl) { ghostEl.remove(); ghostEl = null; }
        if (sourceEl) { try { delete sourceEl.dataset.dragging; } catch { } }
        sourceEl = null;

        desktopViewportEl.querySelectorAll('.is-drop-target')
          .forEach(el => el.classList.remove('is-drop-target'));

        let toPageIndex = currentPage;
        let toSlotIndex = 0;
        let located = false;

        const hitEl = document.elementFromPoint(x, y);
        const hitSlot = hitEl?.closest('.slot');

        if (hitSlot) {
          const si = +hitSlot.dataset.pageIndex;
          const sj = +hitSlot.dataset.slotIndex;
          if (si === currentPage) {
            toPageIndex = si;
            toSlotIndex = sj;
            located = true;
          }
        }

        if (!located) {
          const pageEl = desktopTrackEl.querySelector(
            `.desktop-page[data-page-index="${currentPage}"]`
          );
          if (pageEl) {
            let bestIdx = 0;
            let bestDist = Infinity;
            pageEl.querySelectorAll('.slot').forEach((s, i) => {
              const r = s.getBoundingClientRect();
              const cx = r.left + r.width / 2;
              const cy = r.top + r.height / 2;
              const d = (cx - x) ** 2 + (cy - y) ** 2;
              if (d < bestDist) { bestDist = d; bestIdx = i; }
            });
            toSlotIndex = bestIdx;
          }
        }

        const samePos =
          draggedFrom &&
          toPageIndex === draggedFrom.pageIndex &&
          toSlotIndex === draggedFrom.slotIndex;

        if (!samePos) {
          const pagesBefore = DesktopLayout.snapshot();
          const targetPage = pagesBefore[toPageIndex];
          const targetSlot = targetPage?.slots?.[toSlotIndex];
          const targetFilled = !!(targetSlot && targetSlot.bundle);

          if (!targetFilled) {
            const focusPageId = targetPage?.pageId;

            DesktopLayout.move(draggedBundle, toPageIndex, toSlotIndex);

            if (focusPageId) {
              const pagesAfter = DesktopLayout.snapshot();
              const newIndex = pagesAfter.findIndex(p => p.pageId === focusPageId);
              if (newIndex >= 0) currentPage = newIndex;
            }
          }
        }

        draggedBundle = null;
        draggedFrom = null;
        edgeFirstFired = false;
        clearEdge();
        clearWatchdog();
        releasePointer();

        renderHome();
        state = 'idle';
        suppressClickUntil = performance.now() + SUPPRESS_MS;
      }

      function cancelDrag() {
        if (state !== 'dragging') return;

        clearLongPressTimer();
        hideAppMenu();

        destroyShield();
        destroyPreview();
        if (ghostEl) { ghostEl.remove(); ghostEl = null; }
        if (sourceEl) { try { delete sourceEl.dataset.dragging; } catch { } }
        sourceEl = null;
        draggedBundle = null;
        draggedFrom = null;

        desktopViewportEl.querySelectorAll('.is-drop-target')
          .forEach(el => el.classList.remove('is-drop-target'));

        edgeFirstFired = false;
        clearEdge();
        clearWatchdog();
        releasePointer();

        renderHome();
        state = 'idle';
        suppressClickUntil = performance.now() + SUPPRESS_MS;
      }

      desktopViewportEl.addEventListener('pointerdown', e => {
        if (state !== 'idle') return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;

        const appEl = e.target.closest('.app');
        if (!appEl) return;

        hideAppMenu();

        activePointerId = e.pointerId;
        pressStart = { x: e.clientX, y: e.clientY };
        const px = e.clientX, py = e.clientY;
        const targetApp = appEl;

        pressTimer = setTimeout(() => {
          pressTimer = null;
          startDrag(px, py, targetApp);

          clearLongPressTimer();
          longPressMenuTimer = setTimeout(() => {
            longPressMenuTimer = null;
            if (state !== 'dragging') return;

            const bundle = targetApp.dataset.bundle;
            if (!bundle || !WujiApps.isInstalled(bundle)) return;

            const el = desktopViewportEl.querySelector(
              `.app[data-bundle="${bundle}"]`
            );
            const anchorRect = el
              ? el.getBoundingClientRect()
              : targetApp.getBoundingClientRect();

            cancelDrag();
            showUninstallMenu(bundle, anchorRect);
          }, Math.max(0, UNINSTALL_HOLD_MS - HOLD_MS));
        }, HOLD_MS);
      }, { passive: true });

      document.addEventListener('pointermove', e => {
        if (pressTimer && pressStart) {
          const dx = e.clientX - pressStart.x;
          const dy = e.clientY - pressStart.y;
          if (Math.hypot(dx, dy) > MOVE_CANCEL) {
            clearTimeout(pressTimer);
            pressTimer = null;
            pressStart = null;
            activePointerId = null;
            suppressClickUntil = performance.now() + SUPPRESS_MS;
          }
        }

        if (state !== 'dragging') return;
        if (activePointerId !== null && e.pointerId !== activePointerId) return;

        if (longPressMenuTimer && pressStart) {
          const mdx = e.clientX - pressStart.x;
          const mdy = e.clientY - pressStart.y;
          if (Math.hypot(mdx, mdy) > MOVE_CANCEL) {
            clearLongPressTimer();
          }
        }

        moveGhost(e.clientX, e.clientY);
        checkEdge(e.clientX);

        suppressClickUntil = performance.now() + SUPPRESS_MS;

        const slotEl = pickSlotAt(e.clientX, e.clientY);

        desktopViewportEl.querySelectorAll('.is-drop-target')
          .forEach(x => x.classList.remove('is-drop-target'));

        if (slotEl) {
          slotEl.classList.add('is-drop-target');

          const pi = +slotEl.dataset.pageIndex;
          const si = +slotEl.dataset.slotIndex;
          const pages = DesktopLayout.snapshot();
          const targetSlot = pages[pi]?.slots?.[si];
          const targetFilled = !!(targetSlot && targetSlot.bundle);

          updatePreview(targetFilled ? null : slotEl);
        } else {
          updatePreview(null);
        }

        if (e.cancelable) e.preventDefault();
      }, { passive: false });

      document.addEventListener('touchmove', e => {
        if (state === 'dragging' && e.cancelable) e.preventDefault();
      }, { passive: false });

      document.addEventListener('pointerup', e => {
        if (pressTimer) {
          clearTimeout(pressTimer);
          pressTimer = null;
          pressStart = null;
          activePointerId = null;
        }
        clearLongPressTimer();

        if (state !== 'dragging') return;
        if (activePointerId !== null && e.pointerId !== activePointerId) return;
        finishDrag(e.clientX, e.clientY);
      });

      document.addEventListener('pointercancel', () => {
        if (pressTimer) {
          clearTimeout(pressTimer);
          pressTimer = null;
          pressStart = null;
          activePointerId = null;
        }
        clearLongPressTimer();
        cancelDrag();
      });

      document.addEventListener('touchcancel', () => {
        clearLongPressTimer();
        cancelDrag();
      }, { passive: true });

      window.addEventListener('blur', () => {
        clearLongPressTimer();
        cancelDrag();
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          clearLongPressTimer();
          cancelDrag();
        }
      });

      return {
        get state() { return state; },
        get suppressClickUntil() { return suppressClickUntil; },
      };
    })();

    let appMenuEl = null;
    let appMenuCloseHandler = null;

    function hideAppMenu() {
      if (appMenuCloseHandler) {
        document.removeEventListener('pointerdown', appMenuCloseHandler, true);
        appMenuCloseHandler = null;
      }
      if (appMenuEl) {
        appMenuEl.remove();
        appMenuEl = null;
      }
    }

    function showUninstallMenu(bundle, anchorRect) {
      hideAppMenu();

      if (!bundle || !WujiApps.isInstalled(bundle)) return;
      if (!anchorRect) return;

      const menu = document.createElement('div');
      menu.className = 'app-menu';
      menu.innerHTML = `
        <button class="app-menu__item" type="button">
          <span class="app-menu__icon">
            <svg viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18"/>
              <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
              <path d="M10 11v6"/>
              <path d="M14 11v6"/>
            </svg>
          </span>
          <span>卸载</span>
        </button>
      `;

      document.body.appendChild(menu);
      appMenuEl = menu;

      const menuRect = menu.getBoundingClientRect();
      const GAP = 8;
      const EDGE = 8;
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      let left = anchorRect.right + GAP;
      if (left + menuRect.width > vw - EDGE) {
        left = anchorRect.left - menuRect.width - GAP;
      }
      if (left < EDGE) left = EDGE;
      if (left + menuRect.width > vw - EDGE) {
        left = vw - EDGE - menuRect.width;
      }

      let top = anchorRect.top + anchorRect.height / 2 - menuRect.height / 2;
      top = Math.max(EDGE, Math.min(top, vh - menuRect.height - EDGE));

      menu.style.left = left + 'px';
      menu.style.top = top + 'px';

      menu.querySelector('.app-menu__item').addEventListener('click', async () => {
        hideAppMenu();

        const liveEl = desktopViewportEl.querySelector(
          `.app[data-bundle="${bundle}"]`
        );
        if (liveEl) {
          liveEl.style.transition = 'opacity .18s ease, transform .18s ease';
          liveEl.style.opacity = '0';
          liveEl.style.transform = 'scale(.8)';
        }

        setTimeout(async () => {
          try {
            await WujiAppInstaller.uninstall(bundle);
          } catch (err) {
            console.error('[uninstall]', err);
          }
        }, 180);
      });

      appMenuCloseHandler = ev => {
        if (menu.contains(ev.target)) return;
        hideAppMenu();
      };
      requestAnimationFrame(() => {
        if (appMenuEl === menu && appMenuCloseHandler) {
          document.addEventListener('pointerdown', appMenuCloseHandler, true);
        }
      });
    }

    desktopViewportEl.addEventListener('click', e => {
      if (DesktopDrag.state === 'dragging') return;
      if (performance.now() < DesktopDrag.suppressClickUntil) return;
      if (performance.now() - _lastPointerOpenAt < 500) return;

      let appEl = e.target.closest('.app');
      if (!appEl) {
        const hit = document.elementFromPoint(e.clientX, e.clientY);
        appEl = hit?.closest('.app') || null;
      }

      if (!appEl) return;
      openApp(appEl.dataset.bundle, appEl, null);
    });

    /* =========================================================
       打开动画 1：桌面图标飞到中心 + 白色遮罩扩散
       ========================================================= */
    function playIconFlyEnter(iconInfo, contentReady) {
      return new Promise(resolve => {
        const { size, br, styleAttr, html, rect } = iconInfo;

        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;

        const startLeft = Math.round(cx - size / 2);
        const startTop = Math.round(cy - size / 2);
        const targetLeft = Math.round((window.innerWidth - size) / 2);
        const targetTop = Math.round((window.innerHeight - size) / 2);

        const HOLD = 60, GROW = 520, FADE = 280;
        const EASE = 'cubic-bezier(.4, 0, .2, 1)';

        const mask = document.createElement('div');
        mask.style.cssText = `
          position: fixed;
          left: ${startLeft}px;
          top: ${startTop}px;
          width: ${size}px;
          height: ${size}px;
          border-radius: ${br};
          background: #fff;
          z-index: 40;
          pointer-events: none;
          will-change: left, top, width, height, border-radius;
        `;

        const flyingIcon = document.createElement('div');
        flyingIcon.innerHTML = html;
        flyingIcon.style.cssText = `
          position: fixed;
          left: ${startLeft}px;
          top: ${startTop}px;
          width: ${size}px;
          height: ${size}px;
          border-radius: ${br};
          overflow: hidden;
          z-index: 45;
          pointer-events: none;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 26px;
          line-height: 1;
          ${styleAttr}
          will-change: left, top, opacity;
        `;
        flyingIcon.querySelectorAll('img').forEach(img => {
          img.style.cssText = `
            width: 100%; height: 100%;
            object-fit: cover; display: block;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
          `;
        });

        document.body.appendChild(mask);
        document.body.appendChild(flyingIcon);

        setTimeout(() => {
          mask.style.transition = `
            left ${GROW}ms ${EASE}, top ${GROW}ms ${EASE},
            width ${GROW}ms ${EASE}, height ${GROW}ms ${EASE},
            border-radius ${GROW}ms ${EASE}
          `;
          flyingIcon.style.transition = `
            left ${GROW}ms ${EASE}, top ${GROW}ms ${EASE}
          `;

          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              mask.style.left = '0';
              mask.style.top = '0';
              mask.style.width = window.innerWidth + 'px';
              mask.style.height = window.innerHeight + 'px';
              mask.style.borderRadius = '0';

              flyingIcon.style.left = targetLeft + 'px';
              flyingIcon.style.top = targetTop + 'px';
            });
          });

          setTimeout(async () => {
            try { await contentReady; } catch { }

            appScreen.style.transition = 'none';
            appScreen.style.opacity = '1';

            flyingIcon.style.transition = `opacity ${FADE}ms ease`;
            flyingIcon.style.opacity = '0';

            mask.style.transition = `opacity ${FADE}ms ease`;
            mask.style.opacity = '0';

            setTimeout(() => {
              mask.remove();
              flyingIcon.remove();
              appScreen.style.opacity = '';
              resolve();
            }, FADE + 30);
          }, GROW);
        }, HOLD);
      });
    }

    /* =========================================================
       打开动画 2/3：白色遮罩从下方滑上来，中间带应用图标
         oldGhost 非空时（第三种）同时把旧应用上移顶出去
       ========================================================= */
    function playSlideUpEnter(app, oldGhost, contentReady) {
      return new Promise(resolve => {
        const DUR = 460, FADE = 220;
        const EASE = 'cubic-bezier(.2,.7,.3,1)';

        const mask = document.createElement('div');
        mask.style.cssText = `
          position: fixed;
          inset: 0;
          background: #fff;
          z-index: 40;
          pointer-events: none;
          will-change: transform, opacity;
          display: flex;
          align-items: center;
          justify-content: center;
          transform: translateY(100%);
        `;

        const SZ = 76;
        const iconBox = document.createElement('div');
        iconBox.style.cssText = `
          width: ${SZ}px;
          height: ${SZ}px;
          border-radius: 16px;
          overflow: hidden;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 40px;
          line-height: 1;
          ${app.iconStyle || ''}
          will-change: opacity;
        `;

        const icon = app.icon || '';
        if (/^(https?:|data:|\.{1,2}\/|\/)/.test(icon)) {
          iconBox.innerHTML = `<img src="${icon}" alt="" draggable="false">`;
          const img = iconBox.querySelector('img');
          if (img) {
            img.style.cssText = `
              width: 100%; height: 100%;
              object-fit: cover; display: block;
              pointer-events: none;
              user-select: none;
              -webkit-user-drag: none;
            `;
          }
        } else {
          iconBox.innerHTML = `<span>${icon}</span>`;
        }

        mask.appendChild(iconBox);
        document.body.appendChild(mask);

        /* 第三种：旧应用同时上移 */
        if (oldGhost) {
          oldGhost.style.transition = `transform ${DUR}ms ${EASE}`;
        }

        requestAnimationFrame(() => {
          mask.style.transition = `transform ${DUR}ms ${EASE}`;
          mask.style.transform = 'translateY(0)';
          if (oldGhost) oldGhost.style.transform = 'translateY(-100%)';
        });

        setTimeout(async () => {
          try { await contentReady; } catch { }

          appScreen.style.transition = 'none';
          appScreen.style.opacity = '1';

          iconBox.style.transition = `opacity ${FADE}ms ease`;
          iconBox.style.opacity = '0';

          mask.style.transition = `transform ${DUR}ms ${EASE}, opacity ${FADE}ms ease`;
          mask.style.opacity = '0';

          setTimeout(() => {
            mask.remove();
            appScreen.style.opacity = '';
            resolve();
          }, FADE + 30);
        }, DUR + 30);
      });
    }

    async function openApp(bundle, sourceEl, params, animType) {
      let app = WujiApps.get(bundle);
      if (!app) return;

      if (S.view === 'app' && S.currentBundle === bundle && currentNav) {
        try {
          window.dispatchEvent(new CustomEvent('wuji:app-params', {
            detail: { bundle, params: params || {} },
          }));
        } catch { }
        return;
      }

      if (!sourceEl) {
        _suppressClicksUntil = performance.now() + 450;
      }

      if (!animType) {
        if (sourceEl) animType = 'icon-fly';
        else if (S.view === 'app' && S.currentBundle) animType = 'push-up';
        else animType = 'slide-up';
      }

      let iconInfo = null;
      if (animType === 'icon-fly') {
        const iconEl = sourceEl?.querySelector('.app__icon');
        if (iconEl && iconEl.offsetWidth > 0) {
          iconInfo = {
            size: iconEl.offsetWidth,
            br: getComputedStyle(iconEl).borderRadius,
            styleAttr: iconEl.getAttribute('style') || '',
            html: iconEl.innerHTML,
            rect: iconEl.getBoundingClientRect(),
          };
        } else {
          animType = 'slide-up';
        }
      }

      let oldGhost = null;
      let oldNav = null;

      const cleanupOld = () => {
        if (oldNav) {
          try { oldNav.destroy(); } catch { }
          oldNav = null;
        }
        if (oldGhost) {
          try { oldGhost.remove(); } catch { }
          oldGhost = null;
        }
      };

      if (S.view === 'app' && S.currentBundle) {
        if (animType === 'push-up') {
          oldNav = currentNav;
          currentNav = null;

          oldGhost = document.createElement('div');
          oldGhost.style.cssText = `
        position: absolute;
        inset: 0;
        z-index: 20;
        will-change: transform;
        transform: translateY(0);
        background: var(--wj-bg, #fff);
      `;
          while (appScreen.firstChild) oldGhost.appendChild(appScreen.firstChild);
          appView.appendChild(oldGhost);
        } else {
          if (currentNav) {
            currentNav.destroy();
            currentNav = null;
          } else {
            const oldApp = WujiApps.get(S.currentBundle);
            try { oldApp?.unmount?.(); } catch { }
          }
        }
      }

      try {
        S.currentBundle = bundle;
        currentBackHandler = null;

        setView('app');      
        appScreen.style.transition = 'none';
        appScreen.style.transform = '';
        appScreen.style.opacity = '0';
        try { WujiTheme.post('app-enter', { bundle }); } catch { }

        appScreen.innerHTML = '';

        const shadowHost = document.createElement('div');
        shadowHost.style.cssText = 'position:absolute;inset:0;overflow:hidden;';
        appScreen.appendChild(shadowHost);

        const shadow = shadowHost.attachShadow({ mode: 'open' });

        const baseStyle = document.createElement('style');
        baseStyle.textContent = `
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :host {
      position: absolute; inset: 0; display: block;
      font-family: var(--wj-font); color: var(--wj-text);
      font-size: 16px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: none; text-size-adjust: none;
      -webkit-tap-highlight-color: transparent;
    }
    * { scrollbar-width: none; -ms-overflow-style: none; }
    *::-webkit-scrollbar { display: none; }

    img {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }
    img[data-interactive] { pointer-events: auto; }

    .app-page { box-shadow: -4px 0 12px rgba(0, 0, 0, .08); }
    .app-body {
      flex: 1 1 auto;
      padding: var(--wj-pad);
      padding-top: calc(var(--wj-pad) + var(--statusbar-h));
      overflow-y: auto;
      font-size: var(--wj-fs-md);
      line-height: 1.65;
      color: var(--wj-text-muted);
      height: 100%;
    }
  `;
        shadow.appendChild(baseStyle);

        const compLink = document.createElement('link');
        compLink.rel = 'stylesheet';
        compLink.href = 'styles/components.css';
        shadow.appendChild(compLink);

        const appStyleEl = document.createElement('style');
        shadow.appendChild(appStyleEl);

        const navHost = document.createElement('div');
        navHost.id = 'navHost';
        navHost.style.cssText = 'position:absolute;inset:0;overflow:hidden;';
        shadow.appendChild(navHost);

        /* ---------- content-ready：让动画知道"内容什么时候就绪" ---------- */
        let _resolveContentReady = null;
        const contentReady = new Promise(r => { _resolveContentReady = r; });

        /* ---------- 启动动画（与脚本加载并行） ---------- */
        const animPromise = (animType === 'icon-fly')
          ? playIconFlyEnter(iconInfo, contentReady)

    const BootAudio = (() => {
      let ctx = null;
      let unlocked = false;

      function ensureCtx() {
        if (ctx) return ctx;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        try { ctx = new AC(); } catch { return null; }
        return ctx;
      }

      function unlock() {
        const c = ensureCtx();
        if (!c) return;
        if (c.state === 'suspended') {
          c.resume()
            .then(() => { unlocked = c.state === 'running'; })
            .catch(() => {});
        } else {
          unlocked = c.state === 'running';
        }
      }

      /* ★ 把解锁挂到"用户真正能点下去的那个文档"上 */
      function attachUnlock() {
        /* 独立打开：监听自身 document */
        if (window.parent === window) {
          const selfHandler = () => {
            unlock();
            if (unlocked) {
              document.removeEventListener('pointerdown', selfHandler, true);
            }
          };
          document.addEventListener('pointerdown', selfHandler, {
            capture: true,
            passive: true,
          });
          return;
        }

        /* 套在模拟器壳子里：监听父文档（同源才能拿到） */
        let parentDoc = null;
        try { parentDoc = window.parent.document; } catch { return; }
        if (!parentDoc) return;

        const handler = () => {
          unlock();
          if (unlocked) {
            try { parentDoc.removeEventListener('pointerdown', handler, true); } catch {}
          }
        };
        try {
          parentDoc.addEventListener('pointerdown', handler, {
            capture: true,
            passive: true,
          });
        } catch {}
      }
      function isBootSoundEnabled() {
        const v = Store.get('wujios.playbootsound', undefined);
        if (v === undefined) {
          Store.set('wujios.playbootsound', true);
          return true;
        }
        return v !== false;
      }

      function play() {
        if (!isBootSoundEnabled()) return;
        const c = ensureCtx();
        if (!c) return;
        if (c.state === 'suspended') c.resume().catch(() => {});

        const t0 = c.currentTime + 0.02;

        const comp = c.createDynamicsCompressor();
        comp.threshold.value = -6;
        comp.knee.value      = 0;
        comp.ratio.value     = 12;
        comp.attack.value    = 0.003;
        comp.release.value   = 0.25;
        comp.connect(c.destination);

        const bus = c.createGain();
        bus.gain.value = 1.0;
        bus.connect(comp);

        /* ★ C5 / E5 / G5 三音和弦：220ms 渐入，1.6s 渐出 */
        [
          { f: 523.25, t: 0.00, d: 0.42, g: 0.34 },   /* C5 */
          { f: 659.25, t: 0.18, d: 0.42, g: 0.32 },   /* E5 */
          { f: 783.99, t: 0.36, d: 0.60, g: 0.30 },   /* G5 */
        ].forEach(n => {
          const o = c.createOscillator();
          o.type = 'triangle';
          o.frequency.value = n.f;
          const g = c.createGain();
          g.gain.setValueAtTime(0.0001, t0 + n.t);
          g.gain.exponentialRampToValueAtTime(n.g, t0 + n.t + 0.04);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + n.t + n.d);
          o.connect(g);
          g.connect(bus);
          o.start(t0 + n.t);
          o.stop(t0 + n.t + n.d + 0.02);
        });
      }

      attachUnlock();   /* ★ 模块创建时就挂好监听 */

      return { unlock, play };
    })();

        velocityY = 0;
      });

      document.addEventListener('pointermove', e => {
        if (!scroller) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        if (!dragging && Math.hypot(dx, dy) > THRESHOLD) {
          dragging = true;
          scroller.style.cursor = 'grabbing';
        }
        if (!dragging) return;

        scroller.scrollTop = startScrollTop - dy;
        scroller.scrollLeft = startScrollLeft - dx;

        const now = performance.now();
        const dt = now - lastT;
        if (dt > 0) {
          velocityY = (e.clientY - lastY) / dt;
          lastY = e.clientY;
          lastT = now;
        }

        e.preventDefault();
      }, { passive: false });

      function endDrag() {
        if (!scroller) return;
        const sc = scroller;
        const wasDragging = dragging;

        sc.style.cursor = '';
        scroller = null;
        dragging = false;

        if (wasDragging) blockClickUntil = performance.now() + 120;

        if (wasDragging && Math.abs(velocityY) > MIN_V) {
          let v = velocityY;
          const step = () => {
            v *= FRICTION;
            sc.scrollTop -= v * 16;
            if (Math.abs(v) > MIN_V) {
              momentumRAF = requestAnimationFrame(step);
            } else {
              momentumRAF = null;
            }
          };
          momentumRAF = requestAnimationFrame(step);
        }
      }

      document.addEventListener('pointerup', endDrag);
      document.addEventListener('pointercancel', endDrag);

      document.addEventListener('click', e => {
        if (performance.now() < blockClickUntil) {
          e.stopPropagation();
          e.preventDefault();
        }
      }, true);
    })();

    document.addEventListener('click', e => {
      if (performance.now() < _suppressClicksUntil) {
        e.stopPropagation();
        e.stopImmediatePropagation();
        e.preventDefault();
      }
    }, true);

    (function disableContextMenu() {
      document.addEventListener('contextmenu', e => {
        const t = e.target;
        /* 图片 → 直接吞掉，避免华为等浏览器的图片菜单 */
        if (t && t.tagName === 'IMG') {
          e.preventDefault();
          e.stopImmediatePropagation();
          return false;
        }
        e.preventDefault();
        return false;
      }, { capture: true });

      document.addEventListener('dragstart', e => {
        e.preventDefault();
        return false;
      }, { capture: true });

      document.addEventListener('selectstart', e => {
        e.preventDefault();
        return false;
      }, { capture: true });
    })();

    /* =========================================================
       预加载
       ========================================================= */
    let _builtinPreloadScheduled = false;
    function scheduleBuiltinPreload() {
      if (_builtinPreloadScheduled) return;
      _builtinPreloadScheduled = true;

      const run = async () => {
        /* 1) 内置应用脚本立即并行发起（不依赖 store/apps.js） */
        const builtinLoads = BUILTIN_APPS.map(m => {
          if (!m.src) return Promise.resolve();
          return WujiAppLoader.load(m.src, m.version).catch(err => {
            console.warn('[preload builtin]', m.bundlename, err);
          });
        });

        /* 2) 串行前置脚本（store/apps.js） */
        for (const src of PRELOAD_SCRIPTS) {
          try {
            await WujiAppLoader.load(src);
          } catch (err) {
            console.warn('[preload script]', src, err);
          }
        }

        /* 3) 清理不在市场清单里的已安装应用（必须在加载 installed 脚本前） */
        try {
          const n = await WujiAppInstaller.pruneMissing?.();
          if (n) console.log('[prune] removed', n);
        } catch (e) {
          console.warn('[prune] 失败', e);
        }

        /* 4) 已安装市场应用脚本并行发起 */
        const installedLoads = WujiApps.installeds().map(app => {
          if (!app._src) return Promise.resolve();
          return WujiAppLoader.load(app._src, app.version).catch(err => {
            console.warn('[preload installed]', app.bundlename, err);
          });
        });

        await Promise.allSettled([...builtinLoads, ...installedLoads]);
      };

      if ('requestIdleCallback' in window) {
        requestIdleCallback(() => run(), { timeout: 4000 });
      } else {
        setTimeout(run, 1500);
      }
    }

    WujiTheme.init();
    PanelSystem.init();
    (function migrateControlKeys() {
      const KEYS = ['volume', 'brightness', 'wifi', 'bluetooth', 'soundmode', 'cellular'];
      let migrated = 0;
      for (const k of KEYS) {
        const oldVal = Store.get('control.' + k, undefined);
        if (oldVal !== undefined) {
          Store.set('wujios.' + k, oldVal);
          Store.remove('control.' + k);
          migrated++;
        }
      }
      Store.remove('control.nb');
      if (migrated) {
        console.log('[migrate] control.* → wujios.*:', migrated);
      }
    })();
    WujiControlCenter.init({ osEl, notifyParent });

    function launchAppFromNotification(bundle, params) {
      PanelSystem.close();
      openApp(bundle, null, params);
    }

    WujiNotification.init({
      osEl,
      openApp: launchAppFromNotification,
    });

    /* 内置应用：先登记元数据，桌面图标立刻可见 */
    BUILTIN_APPS.forEach(meta => WujiApps.registerMeta(meta, 'builtin'));

    WujiAppInstaller.restore();
    DesktopLayout.seedFromRegistry();
    renderHome();

    WujiApps.on(evt => {
      if (evt.type === 'unregistered') {
        DesktopLayout.removeApp(evt.bundle);
        renderHome();
      } else if (evt.type === 'registered') {
        DesktopLayout.seedFromRegistry();
        renderHome();
      }
    });

    window.addEventListener('resize', () => {
      const w = desktopViewportEl.offsetWidth;
      desktopTrackEl.style.transition = 'none';
      desktopTrackEl.style.transform = `translateX(${-currentPage * w}px)`;
    });
    const HardwareUI = (() => {
      const hudEl      = document.getElementById('hwVolumeHud');
      const hudBar     = hudEl.querySelector('i');
      const menuEl     = document.getElementById('hwMenu');
      const menuPanel  = document.getElementById('hwMenuPanel');
      const menuClose  = document.getElementById('hwMenuClose');

      const VOL_STEP         = 5;
      const VOL_REPEAT_START = 400;
      const VOL_REPEAT_EVERY = 80;

      let volPressTimer  = null;
      let volRepeatTimer = null;
      let volHideTimer   = null;

      /* ★ 唯一权威：每次从 Store 读，不保留本地副本 */
      function readVolume() {
        return Store.get('wujios.volume', 60);
      }

      /* ---------- 音量 ---------- */
      function showHud(value) {
        hudBar.style.height = value + '%';
        hudEl.classList.add('is-visible');
        clearTimeout(volHideTimer);
        volHideTimer = setTimeout(() => {
          hudEl.classList.remove('is-visible');
        }, 1400);
      }

      function changeVolume(delta) {
        const cur  = readVolume();
        const next = Math.max(0, Math.min(100, cur + delta));
        if (next === cur) return false;

        showHud(next);

        /* Store 由 HardwareUI 与 ControlCenter 各写一次（幂等），
           UI 更新走 ControlCenter；两者读同一权威，不再分叉 */
        Store.set('wujios.volume', next);
        try { WujiControlCenter?.setVolume?.(next); } catch {}

        notifyParent('volume-change', { volume: next });
        return true;
      }

      function startVolLoop(dir) {
        stopVolLoop();
        if (!changeVolume(dir * VOL_STEP)) return;
        volPressTimer = setTimeout(() => {
          volRepeatTimer = setInterval(() => {
            if (!changeVolume(dir * VOL_STEP)) stopVolLoop();
          }, VOL_REPEAT_EVERY);
        }, VOL_REPEAT_START);
      }

      function stopVolLoop() {
        clearTimeout(volPressTimer);
        clearInterval(volRepeatTimer);
        volPressTimer  = null;
        volRepeatTimer = null;
      }

      /* ---------- 电源菜单 ---------- */
      const ICON_REBOOT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 3-6.7"/>
        <path d="M3 4v5h5"/>
      </svg>`;
      const ICON_POWER = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v10"/>
        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
      </svg>`;

      function buildMenuButtons() {
        if (S.power === 'off') {
          return `
            <button class="hw-menu-btn" data-action="power-on" type="button">
              ${ICON_POWER}
              <span>开机</span>
            </button>
          `;
        }
        return `
          <button class="hw-menu-btn" data-action="restart" type="button">
            ${ICON_REBOOT}
            <span>重启</span>
          </button>
          <button class="hw-menu-btn" data-action="shutdown" type="button">
            ${ICON_POWER}
            <span>关机</span>
          </button>
        `;
      }

      function showMenu() {
        if (S.power === 'booting' || S.power === 'shuttingdown') return;
        if (menuEl.classList.contains('is-open')) {
          hideMenu();
          return;
        }
        PanelSystem.close();
        WujiNotification.hideBanner?.();

        menuPanel.innerHTML = buildMenuButtons();
        menuEl.classList.add('is-open');
      }

      function hideMenu() {
        menuEl.classList.remove('is-open');
        menuPanel.innerHTML = '';
      }

      function isMenuOpen() {
        return menuEl.classList.contains('is-open');
      }

      menuClose.addEventListener('click', hideMenu);

      menuEl.addEventListener('click', e => {
        if (e.target === menuEl) { hideMenu(); return; }
        const btn = e.target.closest('button[data-action]');
        if (!btn) return;
        const action = btn.dataset.action;
        hideMenu();
        if (action === 'power-on')  powerOn();
        else if (action === 'restart')  restart();
        else if (action === 'shutdown') powerOff();
      });

      /* ---------- 短按 / 长按电源键 ---------- */
      function powerShort() {
        if (S.power === 'off') {
          powerOn();
          return;
        }
        if (S.power === 'booting' || S.power === 'shuttingdown') return;

        if (isMenuOpen()) hideMenu();

        if (S.screenOff) {
          setScreenOff(false);
        } else {
          S.viewBeforeLock = S.view === 'app' ? 'app' : 'home';
          hidePasswordPanel();
          PanelSystem.close();
          WujiNotification.hideBanner?.();
          setScreenOff(true);
          setView('locked');
        }
      }

      /* ---------- 对外 API ---------- */
      return {
        powerShort,
        powerLong: showMenu,
        volumePress:   (dir) => startVolLoop(dir),
        volumeRelease: stopVolLoop,
        hideMenu,
        isMenuOpen,
        /* ★ 实时读 Store，游戏等模块拿到的是最新值 */
        getVolume: () => readVolume(),
      };
    })();

    /* ---------- setScreenOff ---------- */
    function setScreenOff(off) {
      S.screenOff = !!off;
      osEl.classList.toggle('screen-off', !!off);
    }

    /* ---------- 接收硬件层消息 ---------- */
    window.addEventListener('message', e => {
      const d = e.data;
      if (!d || d.type !== 'iwuji:control') return;
      switch (d.action) {
        case 'hw:power-short':      HardwareUI.powerShort();         break;
        case 'hw:power-long':       HardwareUI.powerLong();          break;
        case 'hw:vol-up-press':     HardwareUI.volumePress(+1);      break;
        case 'hw:vol-up-release':   HardwareUI.volumeRelease();      break;
        case 'hw:vol-down-press':   HardwareUI.volumePress(-1);      break;
        case 'hw:vol-down-release': HardwareUI.volumeRelease();      break;
      }
    });
    notifyParent('statechange', { state: S.power });
  </script>

</body>
