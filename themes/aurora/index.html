<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aurora</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  let paused = false;
  let progress = 0;

  function resize(w, h, d) {
    dpr = d || Math.min(devicePixelRatio || 1, 2);
    W = w || innerWidth;
    H = h || innerHeight;
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();

  const parts = Array.from({ length: 40 }, () => ({
    x: Math.random(), y: Math.random(),
    r: 40 + Math.random() * 120,
    h: 160 + Math.random() * 100,
    vx: (Math.random() - .5) * 0.0004,
    vy: (Math.random() - .5) * 0.0004,
  }));

  let t0 = performance.now();

  function frame() {
    if (!paused) {
      const lift = 8 + progress * 12;
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, `hsl(220, 40%, ${10 + lift}%)`);
      bg.addColorStop(1, `hsl(240, 50%, ${4 + lift}%)`);
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      ctx.globalCompositeOperation = 'lighter';
      const sb = 1 + progress * 0.08;
      for (const p of parts) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < -0.1) p.x = 1.1;
        if (p.x > 1.1) p.x = -0.1;
        if (p.y < -0.1) p.y = 1.1;
        if (p.y > 1.1) p.y = -0.1;
        const cx = p.x * W, cy = p.y * H, r = p.r * sb;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        g.addColorStop(0, `hsla(${p.h}, 80%, 60%, .28)`);
        g.addColorStop(1, `hsla(${p.h}, 80%, 60%, 0)`);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  addEventListener('message', e => {
    const d = e.data;
    if (!d || d.source !== 'wuji-os') return;
    const { type, payload } = d;

    switch (type) {
      case 'init':
        if (payload.size) resize(payload.size.w, payload.size.h, payload.size.dpr);
        /* ★ init 不暂停，挂载后立即播放 */
        break;

      case 'resize':
        resize(payload.w, payload.h, payload.dpr);
        break;

      case 'power':
        if (payload.state === 'off' || payload.state === 'shuttingdown') {
          paused = true;
        } else if (payload.state === 'running') {
          paused = false;
          t0 = performance.now();
        }
        /* booting 保持当前状态 */
        break;

      case 'view':
        if (payload.view === 'app') {
          paused = true;
        } else {
          paused = false;
          t0 = performance.now();
        }
        break;

      case 'unlock-progress':
        progress = Math.max(0, Math.min(1, payload.p || 0));
        paused = false;
        break;
      case 'unlock-finish':
        progress = 1;
        paused = false;
        break;
      case 'unlock-cancel':
      case 'lock-enter':
        progress = 0;
        paused = false;
        break;

      /* 兼容老的 app-enter / app-exit */
      case 'app-enter': paused = true;  break;
      case 'app-exit':  paused = false; t0 = performance.now(); break;
    }
  });

  parent.postMessage({ source: 'wuji-theme', type: 'ready' }, '*');
})();
</script>
</body>
</html>
