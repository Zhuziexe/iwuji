<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sunrise</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }

  .sky {
    position: absolute; inset: 0;
    background: linear-gradient(
      to bottom,
      #1a1733 0%,
      #3a2a4a 22%,
      #7a4a5a 46%,
      #d47a5a 68%,
      #f5b070 80%,
      #ffd9a0 92%,
      #ffe9c0 100%
    );
    will-change: filter;
    transform-origin: center bottom;
  }

  .sun-glow {
    position: absolute;
    left: 50%; bottom: 22%;
    width: 320px; height: 320px;
    margin-left: -160px;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255, 220, 150, .55) 0%,
      rgba(255, 180, 100, .22) 35%,
      rgba(255, 120, 60, 0) 70%);
    pointer-events: none;
    z-index: 1;
    will-change: transform, opacity;
    transform: translateY(60%);
  }

  .sun {
    position: absolute;
    left: 50%; bottom: 22%;
    width: 130px; height: 130px;
    margin-left: -65px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%,
      #fff8e0 0%,
      #ffd76a 40%,
      #ff9e3a 75%,
      #e07030 100%);
    box-shadow:
      0 0 40px  rgba(255, 200, 100, .7),
      0 0 100px rgba(255, 160, 80, .5),
      0 0 180px rgba(255, 120, 60, .3);
    z-index: 2;
    will-change: transform, filter;
    transform: translateY(60%);
  }

  .cloud {
    position: absolute;
    border-radius: 999px;
    background: rgba(255, 200, 180, .4);
    filter: blur(10px);
    will-change: transform, opacity;
    z-index: 4;
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: inherit;
    border-radius: 50%;
  }

  .cloud--1 { width: 90px;  height: 22px; top: 45%; left: 6%;  animation: drift 26s linear infinite; }
  .cloud--1::before { width: 50px; height: 50px; left: 12px; top: -22px; }
  .cloud--1::after  { width: 38px; height: 38px; right: 12px; top: -16px; }

  .cloud--2 { width: 120px; height: 26px; top: 30%; right: 4%; animation: drift 34s linear infinite reverse; }
  .cloud--2::before { width: 60px; height: 60px; left: 18px; top: -28px; }
  .cloud--2::after  { width: 44px; height: 44px; right: 18px; top: -22px; }

  .cloud--3 { width: 70px;  height: 18px; top: 58%; left: 65%; animation: drift 42s linear infinite; }
  .cloud--3::before { width: 40px; height: 40px; left: 10px; top: -18px; }

  @keyframes drift {
    from { transform: translateX(-30px); }
    to   { transform: translateX(calc(100vw + 30px)); }
  }

  .bird {
    position: absolute;
    width: 14px; height: 12px;
    z-index: 4;
    opacity: .5;
  }
  .bird::before, .bird::after {
    content: '';
    position: absolute;
    width: 8px; height: 8px;
    border: 1.5px solid rgba(50, 30, 40, .55);
    border-top: 0;
    border-left: 0;
    border-right: 0;
    border-radius: 50%;
    top: 0;
  }
  .bird::before { left: 0; }
  .bird::after  { left: 6px; }

  .bird--1 { top: 34%; left: 30%; animation: fly 18s linear infinite; }
  .bird--2 { top: 30%; left: 34%; transform: scale(.8); animation: fly 22s linear infinite .8s; }
  .bird--3 { top: 38%; left: 26%; transform: scale(.7); animation: fly 25s linear infinite 1.5s; }

  @keyframes fly {
    from { transform: translate(0, 0); }
    50%  { transform: translate(20vw, -2vh); }
    to   { transform: translate(40vw, 0); }
  }

  .horizon {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 22%;
    background: linear-gradient(to bottom,
      #2a1a30 0%,
      #1a1020 60%,
      #0a0810 100%);
    z-index: 3;
  }
  .horizon::before {
    content: '';
    position: absolute;
    top: -1px; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(to right,
      transparent 0%,
      rgba(255, 200, 140, .55) 35%,
      rgba(255, 220, 170, .8) 50%,
      rgba(255, 200, 140, .55) 65%,
      transparent 100%);
  }
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<div class="sun-glow" id="glow"></div>
<div class="sun" id="sun"></div>

<div class="cloud cloud--1"></div>
<div class="cloud cloud--2"></div>
<div class="cloud cloud--3"></div>

<div class="bird bird--1"></div>
<div class="bird bird--2"></div>
<div class="bird bird--3"></div>

<div class="horizon"></div>

<script>
(() => {
  const sky    = document.getElementById('sky');
  const sun    = document.getElementById('sun');
  const glow   = document.getElementById('glow');
  const clouds = document.querySelectorAll('.cloud');
  const birds  = document.querySelectorAll('.bird');

  let progress = 0;

  function applyProgress() {
    const risePct = 60 - progress * 60;

    sun.style.transition   = 'none';
    glow.style.transition  = 'none';
    sky.style.transition   = 'none';

    sun.style.transform  = `translateY(${risePct}%) scale(${1 + progress * 0.08})`;
    sun.style.filter     = `brightness(${0.75 + progress * 0.35})`;

    glow.style.transform = `translateY(${risePct}%) scale(${1 + progress * 0.15})`;
    glow.style.opacity   = String(0.6 + progress * 0.4);

    sky.style.filter = `brightness(${0.85 + progress * 0.35}) saturate(${1 + progress * 0.2})`;

    clouds.forEach((c, i) => {
      c.style.opacity = String((0.2 + progress * 0.5) * (1 - i * 0.15));
    });
    birds.forEach(b => {
      b.style.opacity = String(0.2 + progress * 0.4);
    });
  }

  function smooth() {
    const ease = 'transform .45s cubic-bezier(.2,.7,.3,1), filter .45s ease, opacity .45s ease';
    sun.style.transition  = ease;
    glow.style.transition = ease;
    sky.style.transition  = 'filter .45s ease';
    clouds.forEach(c => c.style.transition = 'opacity .45s ease');
    birds.forEach(b => b.style.transition = 'opacity .45s ease');
  }

  function setAnimPlayState(playing) {
    const s = playing ? 'running' : 'paused';
    clouds.forEach(c => { c.style.animationPlayState = s; });
    birds.forEach(b => { b.style.animationPlayState = s; });
  }

  applyProgress();

  addEventListener('message', e => {
    const d = e.data;
    if (!d || d.source !== 'wuji-os') return;
    const { type, payload } = d;

    switch (type) {
      case 'init':
        /* ★ init 不暂停 */
        break;

      case 'power':
        if (payload.state === 'off' || payload.state === 'shuttingdown') {
          setAnimPlayState(false);
        } else if (payload.state === 'running') {
          setAnimPlayState(true);
        }
        /* booting 保持当前状态 */
        break;

      case 'view':
        setAnimPlayState(payload.view !== 'app');
        break;

      case 'unlock-progress':
        progress = Math.max(0, Math.min(1, payload.p || 0));
        applyProgress();
        break;
      case 'unlock-finish':
        progress = 1; smooth(); applyProgress();
        break;
      case 'unlock-cancel':
      case 'lock-enter':
        progress = 0; smooth(); applyProgress();
        break;

      case 'app-enter': setAnimPlayState(false); break;
      case 'app-exit':  setAnimPlayState(true);  break;
    }
  });

  parent.postMessage({ source: 'wuji-theme', type: 'ready' }, '*');
})();
</script>
</body>
</html>
