<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#cf14b6"/>

  <!-- 天线：旋转的细矩形 -->
  <rect x="160" y="46" width="8" height="62" rx="4"
        fill="#ffffff" transform="rotate(30 164 77)"/>

  <!-- 机身 -->
  <rect x="44" y="96" width="168" height="112" rx="20" fill="#ffffff"/>

  <!-- 左侧扬声器格栅 -->
  <rect x="68" y="144" width="56" height="8" rx="4" fill="#cf14b6"/>
  <rect x="68" y="160" width="56" height="8" rx="4" fill="#cf14b6"/>
  <rect x="68" y="176" width="40" height="8" rx="4" fill="#cf14b6"/>

  <!-- 右侧显示屏 -->
  <rect x="140" y="116" width="56" height="28" rx="6"
        fill="#cf14b6" opacity="0.15"/>
  <rect x="148" y="126" width="6" height="8"  rx="2" fill="#cf14b6"/>
  <rect x="158" y="122" width="6" height="16" rx="2" fill="#cf14b6"/>
  <rect x="168" y="124" width="6" height="12" rx="2" fill="#cf14b6"/>

  <!-- 旋钮 -->
  <circle cx="168" cy="180" r="12" fill="#cf14b6"/>
  <circle cx="168" cy="180" r="4"  fill="#ffffff"/>
</svg>