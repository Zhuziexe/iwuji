<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- 灰色方形背景，无圆角，无渐变 -->
  <rect width="256" height="256" fill="#6B7280" />

  <!-- 白色齿轮 -->
  <g transform="translate(128,128)" fill="#FFFFFF">
    <!-- 齿轮主体圆 -->
    <circle cx="0" cy="0" r="64" />

    <!-- 上下左右四个主齿 -->
    <rect x="-12" y="-84" width="24" height="28" />
    <rect x="-12" y="56" width="24" height="28" />
    <rect x="-84" y="-12" width="28" height="24" />
    <rect x="56" y="-12" width="28" height="24" />

    <!-- 四个对角齿 -->
    <g transform="rotate(45)">
      <rect x="-12" y="-84" width="24" height="28" />
      <rect x="-12" y="56" width="24" height="28" />
      <rect x="-84" y="-12" width="28" height="24" />
      <rect x="56" y="-12" width="28" height="24" />
    </g>

    <!-- 中心孔（露出灰色背景） -->
    <circle cx="0" cy="0" r="24" fill="#6B7280" />
  </g>
</svg>