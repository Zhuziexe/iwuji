<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ZhuziOS</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/components.css">
  <script>window.__OPENWUJI_PLATFORM = 'zhuzios';</script>
  <style>
    :root {
      --statusbar-h: 0px;
      --taskbar-h: 48px;
      --start-menu-w: 380px;
      --pc-bg: #ffffff;
      --pc-bg-alt: #f2f5fa;
      --pc-border: #e6e9ef;
      --pc-text: #101828;
      --pc-text-dim: #5b6478;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
      font-family: var(--wj-font, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Microsoft YaHei", sans-serif);
      font-size: var(--wj-fs-md, 16px);
      background: #0f1116;
      color: var(--pc-text);
      user-select: none;
      -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    /* ============================================================
       #os = 整机容器
       ============================================================ */
    #os {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: #0f1116;
    }

    #os>.pc-desktop,
    #os>.pc-wins,
    #os>.pc-taskbar,
    #os>.pc-start-menu,
    #os>#wjOverlayHost,
    #os>#wjDialogHost {
      pointer-events: auto;
    }

    #os .wj-banner.is-show,
    #os .wj-toast {
      pointer-events: auto;
    }

    #wallpaperHost,
    .os-wallpaper-host {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none !important;
      overflow: hidden;
      background: #0b1b33;
    }

    /* ============================================================
       桌面
       ============================================================ */
    .pc-desktop {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: transparent;
      pointer-events: auto;
    }

    /* ============================================================
       窗口层
       ============================================================ */
    .pc-wins {
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      bottom: var(--taskbar-h);
      z-index: 10;
      overflow: hidden;
    }

    .pc-win {
      position: absolute;
      display: flex;
      flex-direction: column;
      background: var(--pc-bg);
      border-radius: 10px;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, .18),
        0 0 0 1px rgba(0, 0, 0, .06);
      overflow: visible;
      min-width: 320px;
      min-height: 220px;
    }

    .pc-win.is-focused {
      box-shadow:
        0 12px 36px rgba(0, 0, 0, .4),
        0 0 0 1px rgba(94, 240, 58, .4);
    }

    .pc-win__titlebar {
      flex: 0 0 auto;
      position: relative;
      z-index: 7;
      height: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding-left: 8px;
      background: var(--wj-bg-alt, var(--pc-bg-alt));
      border-bottom: 1px solid var(--wj-border, var(--pc-border));
      cursor: move;
      user-select: none;
      touch-action: none;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
    }

    .pc-win__back {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--wj-text-muted, var(--pc-text-dim));
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    .pc-win__back svg {
      display: block;
      flex-shrink: 0;
      pointer-events: none;
    }

    .pc-win__back:hover {
      background: rgba(0, 0, 0, .06);
    }

    .pc-win__icon {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      object-fit: cover;
      display: block;
      pointer-events: none;
      flex-shrink: 0;
    }

    .pc-win__title {
      flex: 1 1 auto;
      min-width: 0;
      font-size: 14px;
      font-weight: 500;
      color: var(--wj-text, var(--pc-text));
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pc-win__actions {
      display: flex;
      align-items: center;
      gap: 2px;
      padding-right: 4px;
      flex: 0 0 auto;
    }

    .pc-win__actions button {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--wj-text-muted, var(--pc-text-dim));
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: background .12s, color .12s;
    }

    .pc-win__actions button svg {
      display: block;
      flex-shrink: 0;
      pointer-events: none;
    }

    .pc-win__actions button[data-act="max"] .pc-win__ic-restore {
      display: none;
    }

    .pc-win__actions button[data-act="max"].is-maximized .pc-win__ic-max {
      display: none;
    }

    .pc-win__actions button[data-act="max"].is-maximized .pc-win__ic-restore {
      display: block;
    }

    .pc-win__actions button:hover {
      background: rgba(0, 0, 0, .06);
    }

    .pc-win__actions button.close:hover {
      background: #e0356b;
      color: #fff;
    }

    .pc-win__body {
      flex: 1 1 auto;
      position: relative;
      min-height: 0;
      overflow: hidden;
      background: var(--wj-bg, var(--pc-bg));
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
    }

    .pc-win__rz {
      touch-action: none;
    }

    .pc-win__rz--nw {
      left: -4px !important;
      top: -4px !important;
    }

    .pc-win__rz--ne {
      right: -4px !important;
      top: -4px !important;
    }

    .pc-win__rz--sw {
      left: -4px !important;
      bottom: -4px !important;
    }

    .pc-win__rz--se {
      right: -4px !important;
      bottom: -4px !important;
    }

    /* ============================================================
       任务栏（浅色）
       ============================================================ */
    .pc-taskbar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--taskbar-h);
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 4px;
      background: rgba(245, 247, 250, .9);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-top: 1px solid rgba(0, 0, 0, .08);
      z-index: 500;
      user-select: none;
      color: #101828;
    }

    .pc-taskbar__start {
      height: 36px;
      padding: 0 16px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #101828;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background .12s;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }

    .pc-taskbar__start:hover {
      background: rgba(0, 0, 0, .06);
    }

    .pc-taskbar__start.is-open {
      background: rgba(94, 240, 58, 0.15);
      color: #17a821;
    }

    .pc-taskbar__items {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 8px;
      overflow-x: auto;
      min-width: 0;
      scrollbar-width: none;
    }

    .pc-taskbar__items::-webkit-scrollbar {
      display: none;
    }

    .pc-task-item {
      flex: 0 0 auto;
      height: 36px;
      min-width: 40px;
      max-width: 180px;
      padding: 0 10px;
      border: 0;
      border-radius: 6px;
      background: rgba(0, 0, 0, .04);
      color: #101828;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background .12s;
      -webkit-tap-highlight-color: transparent;
    }

    .pc-task-item:hover {
      background: rgba(0, 0, 0, .09);
    }

    .pc-task-item.is-active {
      background: rgba(94, 240, 58, .18);
      color: #17a821;
    }

    .pc-task-item img {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
      pointer-events: none;
    }

    .pc-task-item__title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .pc-taskbar__clock {
      flex: 0 0 auto;
      height: 36px;
      padding: 0 14px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      color: #3d4658;
      font-variant-numeric: tabular-nums;
      letter-spacing: .5px;
      white-space: nowrap;
      cursor: pointer;
      transition: background .12s, color .12s;
      -webkit-tap-highlight-color: transparent;
    }

    .pc-taskbar__clock:hover {
      background: rgba(0, 0, 0, .06);
    }

    .pc-taskbar__clock.is-active {
      background: rgba(94, 240, 58, 0.15);
      color: #17a821;
    }

    .pc-taskbar__tray {
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #3d4658;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .12s, color .12s;
      -webkit-tap-highlight-color: transparent;
    }

    .pc-taskbar__tray:hover {
      background: rgba(0, 0, 0, .06);
    }

    .pc-taskbar__tray.is-active {
      background: rgba(94, 240, 58, 0.15);
      color: #17a821;
    }

    .pc-taskbar__tray svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    /* ============================================================
       开始菜单（浅色）
       ============================================================ */
    .pc-start-menu {
      position: absolute;
      left: 8px;
      bottom: calc(var(--taskbar-h) + 6px);
      width: var(--start-menu-w);
      max-height: 60vh;
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, .08);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .18);
      z-index: 510;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: #101828;
      animation: pcMenuIn .18s cubic-bezier(.2, .7, .3, 1);
    }

    .pc-start-menu[hidden] {
      display: none;
    }

    @keyframes pcMenuIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .pc-start-menu__header {
      padding: 14px 18px 10px;
      font-size: 18px;
      font-weight: 600;
      color: #17a821;
      letter-spacing: .5px;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(0, 0, 0, .06);
    }

    .pc-start-menu__list {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 6px;
    }

    .pc-start-menu__list::-webkit-scrollbar {
      width: 6px;
    }

    .pc-start-menu__list::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, .15);
      border-radius: 3px;
    }

    .pc-start-menu__item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #101828;
      font: inherit;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      transition: background .12s;
      -webkit-tap-highlight-color: transparent;
    }

    .pc-start-menu__item:hover {
      background: rgba(0, 0, 0, .06);
    }

    .pc-start-menu__item img {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
      pointer-events: none;
    }

    .pc-start-menu__item-text {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .pc-start-menu__item-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pc-start-menu__item-desc {
      font-size: 12px;
      color: #7a8494;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pc-start-menu__empty {
      padding: 40px 20px;
      text-align: center;
      color: #6b7280;
      font-size: 14px;
    }

    .pc-start-menu__footer {
      flex: 0 0 auto;
      padding: 8px;
      border-top: 1px solid rgba(0, 0, 0, .06);
      display: flex;
      gap: 6px;
    }

    .pc-start-menu__sys {
      flex: 1 1 0;
      min-width: 0;
      height: 40px;
      padding: 0 10px;
      border: 0;
      border-radius: 8px;
      background: rgba(0, 0, 0, .04);
      color: #101828;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      -webkit-tap-highlight-color: transparent;
      transition: background .12s, color .12s;
    }

    .pc-start-menu__sys svg {
      width: 16px;
      height: 16px;
      display: block;
      flex-shrink: 0;
    }

    .pc-start-menu__sys:hover {
      background: rgba(0, 0, 0, .08);
    }

    .pc-start-menu__sys[data-action="shutdown"]:hover {
      background: rgba(224, 53, 107, .12);
      color: #e0356b;
    }

    /* ============================================================
       关机 / 重启遮罩
       ============================================================ */
    .pc-power-overlay {
      position: fixed;
      inset: 0;
      z-index: 9998;
      /* 低于 pc-boot 的 9999 */
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      color: rgba(255, 255, 255, .82);
      opacity: 0;
      transition: opacity .42s ease;
      pointer-events: auto;
      user-select: none;
    }

    .pc-power-overlay.is-show {
      opacity: 1;
    }

    .pc-power-overlay[hidden] {
      display: none !important;
    }

    .pc-power-overlay.is-off {
      cursor: pointer;
    }

    .pc-power-spinner {
      width: 28px;
      height: 28px;
      border: 2.5px solid rgba(255, 255, 255, .18);
      border-top-color: rgba(255, 255, 255, .95);
      border-radius: 50%;
      animation: pcSpin .82s linear infinite;
    }

    .pc-power-overlay:not(.is-spin) .pc-power-spinner {
      display: none;
    }

    @keyframes pcSpin {
      to {
        transform: rotate(360deg);
      }
    }

    .pc-power-text {
      font-size: 14px;
      letter-spacing: .3px;
      color: rgba(255, 255, 255, .82);
      font-variant-numeric: tabular-nums;
    }

    /* 触屏模式下 footer 按钮也保持基础态 */
    #os.is-touch-mode .pc-start-menu__sys:hover {
      background: rgba(0, 0, 0, .04) !important;
      color: #101828 !important;
    }

    /* ============================================================
       右下角控制中心 / 通知中心（浅色）
       ============================================================ */
    .pc-flyout {
      position: absolute;
      right: 12px;
      bottom: calc(var(--taskbar-h) + 8px);
      width: 340px;
      max-width: calc(100vw - 24px);
      height: 340px;
      max-height: calc(100vh - var(--taskbar-h) - 24px);
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, .08);
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .18);
      z-index: 800;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: #101828;
      pointer-events: auto;
      animation: pcFlyoutIn .18s cubic-bezier(.2, .7, .3, 1);
    }

    .pc-flyout[hidden] {
      display: none;
    }

    @keyframes pcFlyoutIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .pc-flyout__pane {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 14px;
    }

    .pc-cc__grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .pc-cc__card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, .04);
      min-width: 0;
    }

    .pc-cc__row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .pc-cc__label {
      font-size: 12px;
      color: #5b6478;
    }

    .pc-cc__value {
      font-size: 12px;
      font-weight: 600;
      color: #17a821;
    }

    .pc-cc__range {
      width: 100%;
      accent-color: #17a821;
      cursor: pointer;
    }

    .pc-cc__toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border: 0;
      border-radius: 10px;
      background: rgba(0, 0, 0, .04);
      color: #101828;
      font: inherit;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      transition: background .12s;
      -webkit-tap-highlight-color: transparent;
    }

    .pc-cc__toggle.is-on {
      background: rgba(94, 240, 58, 0.15);
      color: #17a821;
    }

    .pc-cc__toggle--wide {
      grid-column: span 2;
    }

    .pc-cc__dot {
      width: 8px;
      height: 8px;
      margin-left: auto;
      border-radius: 50%;
      background: #c0c8d6;
      flex: 0 0 auto;
      transition: background .15s, box-shadow .15s;
    }

    .pc-cc__toggle.is-on .pc-cc__dot {
      background: #22b25b;
      box-shadow: 0 0 8px rgba(34, 178, 91, .6);
    }

    .pc-nc__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px 10px;
    }

    .pc-nc__title {
      font-size: 14px;
      font-weight: 600;
    }

    .pc-nc__clear {
      border: 0;
      background: transparent;
      color: #17a821;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .pc-nc__list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .pc-nc__item {
      position: relative;
      display: flex;
      gap: 10px;
      padding: 10px 34px 10px 10px;
      /* 右侧留出叉号空间 */
      border-radius: 10px;
      background: rgba(0, 0, 0, .04);
      cursor: pointer;
      transition: background .12s;
    }

    .pc-nc__item:hover {
      background: rgba(0, 0, 0, .07);
    }

    .pc-nc__remove {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 24px;
      height: 24px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #8a93a4;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: .65;
      transition: background .12s, color .12s, opacity .12s;
      -webkit-tap-highlight-color: transparent;
    }

    .pc-nc__remove:hover {
      background: rgba(0, 0, 0, .08);
      color: #e0356b;
      opacity: 1;
    }

    .pc-nc__remove svg {
      width: 12px;
      height: 12px;
      display: block;
    }

    .pc-nc__item:hover {
      background: rgba(0, 0, 0, .07);
    }

    .pc-nc__icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      overflow: hidden;
      flex: 0 0 auto;
      display: block;
    }

    .pc-nc__icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .pc-nc__body {
      flex: 1 1 auto;
      min-width: 0;
    }

    .pc-nc__item-head {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 2px;
    }

    .pc-nc__item-title {
      font-size: 13px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pc-nc__item-time {
      margin-left: auto;
      font-size: 11px;
      color: #8a93a4;
      flex: 0 0 auto;
    }

    .pc-nc__item-content {
      font-size: 12px;
      line-height: 1.45;
      color: #5b6478;
      word-break: break-word;
    }

    .pc-nc__empty {
      padding: 36px 0;
      text-align: center;
      font-size: 13px;
      color: #8a93a4;
    }

    .pc-nc__empty[hidden] {
      display: none;
    }

    /* ============================================================
       触屏模式：hover 时保持"基础态"颜色，避免白/灰/蓝闪变
       ============================================================ */

    /* ① 基础态透明的元素 → hover 也透明 */
    #os.is-touch-mode .pc-taskbar__start:not(.is-open):hover,
    #os.is-touch-mode .pc-taskbar__tray:not(.is-active):hover,
    #os.is-touch-mode .pc-taskbar__clock:not(.is-active):hover,
    #os.is-touch-mode .pc-start-menu__item:hover,
    #os.is-touch-mode .pc-win__back:hover,
    #os.is-touch-mode .pc-win__actions button:not(.close):hover {
      background: transparent !important;
    }

    /* ② 基础态是浅灰的元素 → hover 时保持浅灰，别变透明 */
    #os.is-touch-mode .pc-task-item:not(.is-active):hover,
    #os.is-touch-mode .pc-nc__item:hover {
      background: rgba(0, 0, 0, .04) !important;
    }

    /* ③ .pc-cc__toggle 本身没有 hover 规则，不用处理
          （之前写成 :not(.is-on):hover { transparent } 是多余且有害的） */

    /* ④ close 按钮：hover 保持默认色，不出现红底 */
    #os.is-touch-mode .pc-win__actions button.close:hover {
      background: transparent !important;
      color: var(--wj-text-muted, var(--pc-text-dim)) !important;
    }

    /* ⑤ 有状态类的元素：hover 时优先级被上面的 :not() 排除，
          状态色由原规则提供，不额外声明也不会被覆盖 */

    /* ⑥ 触屏模式禁用 transition，避免颜色切换抖动 */
    #os.is-touch-mode .pc-taskbar__start,
    #os.is-touch-mode .pc-taskbar__tray,
    #os.is-touch-mode .pc-taskbar__clock,
    #os.is-touch-mode .pc-task-item,
    #os.is-touch-mode .pc-start-menu__item,
    #os.is-touch-mode .pc-win__back,
    #os.is-touch-mode .pc-win__actions button,
    #os.is-touch-mode .pc-nc__item,
    #os.is-touch-mode .pc-cc__toggle {
      transition: none !important;
    }

    /* ⑦ 缩放热区放大 */
    #os.is-touch-mode .pc-win__rz {
      z-index: 6;
    }

    #os.is-touch-mode .pc-win__rz--n {
      top: -10px !important;
      height: 20px !important;
    }

    #os.is-touch-mode .pc-win__rz--s {
      bottom: -10px !important;
      height: 20px !important;
    }

    #os.is-touch-mode .pc-win__rz--e {
      right: -10px !important;
      width: 20px !important;
    }

    #os.is-touch-mode .pc-win__rz--w {
      left: -10px !important;
      width: 20px !important;
    }

    /* 触屏模式：角落手柄 30×30，负偏移 -10 → 外侧 10px + 内侧 20px，
       即使内侧被标题栏压住，外侧 L 形依然能抓到 */
    #os.is-touch-mode .pc-win__rz--nw {
      left: -10px !important;
      top: -10px !important;
      width: 30px !important;
      height: 30px !important;
    }

    #os.is-touch-mode .pc-win__rz--ne {
      right: -10px !important;
      top: -10px !important;
      width: 30px !important;
      height: 30px !important;
    }

    #os.is-touch-mode .pc-win__rz--sw {
      left: -10px !important;
      bottom: -10px !important;
      width: 30px !important;
      height: 30px !important;
    }

    #os.is-touch-mode .pc-win__rz--se {
      right: -10px !important;
      bottom: -10px !important;
      width: 30px !important;
      height: 30px !important;
    }

    #os.is-touch-mode .pc-nc__remove:hover {
      background: transparent !important;
      color: #8a93a4 !important;
      opacity: .65 !important;
    }

    #wjDialogHost {
      z-index: 900 !important;
    }

    .wj-dialog-backdrop {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0);
      pointer-events: auto;
      transition: background .2s ease;
      box-sizing: border-box;
    }

    .wj-dialog-backdrop.is-show {
      background: rgba(0, 0, 0, .38);
    }

    .wj-dialog {
      width: min(320px, 100%);
      background: #ffffff;
      border-radius: 16px;
      padding: 24px 20px 16px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .28);
      transform: scale(.92);
      opacity: 0;
      transition: transform .2s cubic-bezier(.2, .7, .3, 1), opacity .2s ease;
      will-change: transform, opacity;
    }

    .wj-dialog-backdrop.is-show .wj-dialog {
      transform: scale(1);
      opacity: 1;
    }

    .wj-dialog__title {
      font-size: 17px;
      font-weight: 600;
      color: #101828;
      line-height: 1.4;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .wj-dialog__content {
      font-size: 14px;
      line-height: 1.55;
      color: #5b6478;
      margin-bottom: 20px;
      word-break: break-word;
    }

    .wj-dialog__actions {
      display: flex;
      gap: 8px;
      margin: 0 -20px -16px;
      padding: 12px 16px 14px;
      border-top: 1px solid rgba(0, 0, 0, .06);
    }

    .wj-dialog__btn {
      flex: 1 1 0;
      min-width: 0;
      height: 44px;
      border: 0;
      border-radius: 10px;
      background: rgba(0, 0, 0, .04);
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background .12s;
      -webkit-tap-highlight-color: transparent;
    }

    /* ===== 输入框区域 ===== */
    .wj-dialog__field {
      margin: 2px 0 14px;
    }

    .wj-dialog__input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid rgba(0, 0, 0, .12);
      border-radius: 10px;
      font: inherit;
      font-size: 15px;
      line-height: 1.4;
      color: inherit;
      background: var(--wj-bg, #fff);
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
      -webkit-appearance: none;
      appearance: none;
    }

    .wj-dialog__input::placeholder {
      color: rgba(0, 0, 0, .35);
    }

    .wj-dialog__input:focus {
      border-color: var(--wj-primary, #17a821);
      box-shadow: 0 0 0 3px rgba(94, 240, 58, 0.15);
    }

    .wj-dialog__error {
      display: none;
      margin-top: 6px;
      font-size: 12px;
      line-height: 1.4;
      color: var(--wj-danger, #e5484d);
    }

    /* ===== 主按钮 ===== */
    .wj-dialog__btn--primary {
      font-weight: 600;
    }

    .wj-dialog__btn:hover {
      background: rgba(0, 0, 0, .07);
    }

    .wj-dialog__btn:active {
      background: rgba(0, 0, 0, .1);
    }

    .wj-dialog__btn:disabled {
      opacity: .5;
      cursor: default;
    }

    /* 触屏模式：禁用对话框按钮悬停 */
    #os.is-touch-mode .wj-dialog__btn:hover {
      background: rgba(0, 0, 0, .04) !important;
    }

    /* ============================================================
   右下角固定卡片式横幅（图标左、内容右）
   结构：.wj-banner > .wj-banner__icon + .wj-banner__body(>__title + __content)
   ============================================================ */
    .wj-banner {
      position: absolute;
      top: auto;
      bottom: calc(var(--taskbar-h) + 12px);
      left: auto;
      right: 16px;
      width: 360px;
      max-width: calc(100vw - 32px);

      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      box-sizing: border-box;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, .07);
      border-radius: 14px;
      box-shadow:
        0 16px 48px rgba(0, 0, 0, .18),
        0 0 0 1px rgba(0, 0, 0, .04);
      color: #101828;

      transform: translateX(calc(100% + 32px));
      transition: transform .32s cubic-bezier(.2, .7, .3, 1);
      z-index: 600;
      cursor: pointer;
      overflow: hidden;
    }

    .wj-banner.is-show {
      transform: translateX(0);
    }

    .wj-banner>.wj-banner__icon {
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, .06);
    }

    .wj-banner>.wj-banner__icon img {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .wj-banner>.wj-banner__icon span {
      font-size: 16px;
      font-weight: 600;
      color: #17a821;
      line-height: 1;
    }

    .wj-banner>.wj-banner__body {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .wj-banner>.wj-banner__body>.wj-banner__title {
      font-size: 14px;
      font-weight: 600;
      color: #101828;
      line-height: 1.35;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .wj-banner>.wj-banner__body>.wj-banner__content {
      font-size: 12.5px;
      line-height: 1.45;
      color: #5b6478;
      overflow: hidden;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    #os.is-touch-mode .wj-banner:hover {
      background: #ffffff;
    }

    .wj-toast {
      bottom: calc(var(--taskbar-h) + 24px) !important;
      z-index: 700 !important;
    }

    .pc-lock {
      position: fixed;
      inset: 0;
      z-index: 9998;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      /* ★ 不透明背景，独立场景 */
      background:
        radial-gradient(900px 600px at 50% 40%, #1a3a5c 0%, #0d1928 55%, #060c15 100%);
      transition: opacity .4s cubic-bezier(.4, 0, .2, 1);
      pointer-events: auto;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }

    /* 角落光斑，让背景不单调 */
    .pc-lock::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(600px 400px at 25% 75%, rgba(94, 240, 58, .16), transparent 65%),
        radial-gradient(700px 500px at 75% 25%, rgba(120, 80, 200, .10), transparent 65%);
      pointer-events: none;
    }

    .pc-lock[hidden] {
      display: none !important;
    }

    .pc-lock.is-hiding {
      opacity: 0;
      pointer-events: none;
    }

    .pc-lock__card {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: min(340px, 100%);
      padding: 44px 40px 40px;
      background: transparent;
    }

    /* 头像：loading.png 圆裁 */
    .pc-lock__avatar {
      width: 104px;
      height: 104px;
      flex-shrink: 0;
      border-radius: 50%;
      overflow: hidden;
      background: #eaf0ff;
    }

    .pc-lock__avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .pc-lock__name {
      font-size: 22px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: .3px;
    }

    .pc-lock__form {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      width: 240px;
      max-width: 100%;
    }

    .pc-lock__form[hidden] {
      display: none;
    }

    .pc-lock__input {
      height: 44px;
      padding: 0 14px;
      border: 1px solid rgba(0, 0, 0, .12);
      border-radius: 8px;
      background: rgba(255, 255, 255, .95);
      font: inherit;
      font-size: 15px;
      color: #101828;
      text-align: center;
      letter-spacing: 3px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    .pc-lock__input[hidden] {
      display: none;
    }

    .pc-lock__input:focus {
      border-color: #17a821;
      box-shadow: 0 0 0 3px rgba(94, 240, 58, .18);
    }

    .pc-lock__btn {
      height: 44px;
      border: 0;
      border-radius: 8px;
      background: #17a821;
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background .12s;
      -webkit-tap-highlight-color: transparent;
    }

    .pc-lock__btn:active {
      background: #089612;
    }

    .pc-lock__btn:focus-visible {
      outline: 2px solid rgba(94, 240, 58, .5);
      outline-offset: 2px;
    }

    .pc-lock__welcome {
      font-size: 18px;
      font-weight: 500;
      color: #ffffff;
      letter-spacing: .5px;
      animation: pcLockWelcome .38s cubic-bezier(.2, .7, .3, 1);
    }

    .pc-lock__welcome[hidden] {
      display: none;
    }

    @keyframes pcLockWelcome {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .pc-lock.is-error .pc-lock__input {
      animation: pcLockShake .42s cubic-bezier(.36, .07, .19, .97);
      border-color: #e0356b;
      box-shadow: 0 0 0 3px rgba(224, 53, 107, .15);
    }

    @keyframes pcLockShake {

      10%,
      90% {
        transform: translateX(-2px);
      }

      20%,
      80% {
        transform: translateX(4px);
      }

      30%,
      50%,
      70% {
        transform: translateX(-6px);
      }

      40%,
      60% {
        transform: translateX(6px);
      }
    }


    .pc-boot {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: #fff;
      transition: opacity .55s ease, visibility .55s ease;
      will-change: opacity;
    }

    .pc-boot.is-hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .pc-boot__brand {
      font-size: 59px;
      font-weight: 600;
      letter-spacing: 4px;
      line-height: 1;
      opacity: 0;
      transform: translateY(8px);
      animation: pcBootBrand .9s cubic-bezier(.2, .7, .3, 1) forwards;
    }

    .pc-boot__tag {
      margin-top: 60px;
      font-size: 12px;
      letter-spacing: .5px;
      line-height: 1.4;
      text-align: center;
      color: rgba(255, 255, 255, .72);
      opacity: 0;
      transform: translateY(6px);
      animation: pcBootTag .8s cubic-bezier(.2, .7, .3, 1) .7s forwards;
    }

    .pc-boot__tag span {
      font-weight: 500;
      font-size: 18px;
      color: #fff;
      letter-spacing: .3px;
    }

    @keyframes pcBootBrand {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pcBootTag {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div id="os" data-power="running" data-view="app" data-theme-tone="light">

    <div id="wallpaperHost" class="os-wallpaper-host"></div>

    <div class="pc-desktop"></div>

    <div class="pc-wins" id="pcWins"></div>

    <div class="pc-taskbar" id="pcTaskbar">
      <button class="pc-taskbar__start" id="pcStartBtn" type="button">竹子</button>
      <div class="pc-taskbar__items" id="pcTaskItems"></div>

      <button class="pc-taskbar__tray" id="pcWlanBtn" type="button" title="控制中心" aria-label="控制中心">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M5 12.55a11 11 0 0 1 14.08 0" />
          <path d="M1.42 9a16 16 0 0 1 21.16 0" />

      </button>

      <button class="pc-taskbar__clock" id="pcClock" type="button" title="通知中心" aria-label="通知中心">00:00</button>
    </div>
    <div class="pc-start-menu" id="pcStartMenu" hidden>
      <div class="pc-start-menu__header">所有应用</div>
      <div class="pc-start-menu__list" id="pcStartList"></div>
      <div class="pc-start-menu__footer">
        <button class="pc-start-menu__sys" data-action="lock" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="4" y="11" width="16" height="10" rx="2" />
            <path d="M8 11V7a4 4 0 0 1 8 0v4" />
          </svg>
          <span>锁定</span>
        </button>
        <button class="pc-start-menu__sys" data-action="restart" type="button">

    <!-- ============ 右下角：控制中心 / 通知中心 ============ -->
    <div class="pc-flyout" id="pcFlyout" hidden>

      <!-- 控制中心 -->
      <div class="pc-flyout__pane" data-pane="cc" hidden>
        <div class="pc-cc__grid">
          <div class="pc-cc__card">
            <div class="pc-cc__row">
              <span class="pc-cc__label">音量</span>
              <span class="pc-cc__value" id="pcCcVolVal">60</span>
            </div>
            <input class="pc-cc__range" id="pcCcVolume" type="range" min="0" max="100" step="1" value="60">
          </div>

          <div class="pc-cc__card">
            <div class="pc-cc__row">
              <span class="pc-cc__label">亮度</span>
              <span class="pc-cc__value" id="pcCcBriVal">80</span>
            </div>
            <input class="pc-cc__range" id="pcCcBrightness" type="range" min="0" max="100" step="1" value="80">
          </div>

          <button class="pc-cc__toggle" data-key="wifi" type="button">
            <span>WLAN</span><i class="pc-cc__dot"></i>
          </button>
          <button class="pc-cc__toggle" data-key="bluetooth" type="button">

          <button class="pc-cc__toggle" data-key="soundmode" type="button">

          <button class="pc-cc__toggle" data-key="cellular" type="button">

          </button>

          <button class="pc-cc__toggle pc-cc__toggle--wide" data-key="touchmode" type="button">

      <!-- 通知中心 -->

        <div class="pc-nc__head">

        <div class="pc-nc__list" id="pcNcList"></div>
        <div class="pc-nc__empty" id="pcNcEmpty">无通知</div>

  </div>

  <div class="pc-power-overlay" id="pcPowerOverlay" hidden>
    <div class="pc-power-spinner"></div>
    <div class="pc-power-text" id="pcPowerText"></div>

    <div class="pc-lock__card">

          autocapitalize="off" spellcheck="false">

  <div class="pc-boot" id="pcBoot">

    <div class="pc-boot__tag">
      -Powered by-<br>
      <span>OpenWuji</span>
    </div>
  </div>

  <script src="navigation.js"></script>

  <script>
    (() => {
      const BOOT_MIN_MS = 1800;

      /* ============================================================
         Shadow DOM 内基础样式
         - :host 只设 display:block，不碰 position / width / height
           （宿主定位交给外部 .pc-win__body 的 position: relative）
         ============================================================ */
      const BASE_CSS = `
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :host {
      display: block;
      font-family: var(--wj-font, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif);
      color: var(--wj-text, #101828);

      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: none; text-size-adjust: none;
      -webkit-tap-highlight-color: transparent;
      --statusbar-h: 0px;
      container-type: size;
      container-name: wj-app;
    }
    * { scrollbar-width: thin; scrollbar-color: rgba(0,0,0,.2) transparent; }
    *::-webkit-scrollbar { width: 8px; height: 8px; }
    *::-webkit-scrollbar-thumb { background: rgba(0,0,0,.2); border-radius: 4px; }
    *::-webkit-scrollbar-track { background: transparent; }

    img {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }
    img[data-interactive] { pointer-events: auto; }
  `;

      /* ============================================================
         stub

      if (!window.WujiControlCenter) {
        window.WujiControlCenter = {
          getVolume: () => Store.get('wujios.volume', 60),
          setVolume: v => Store.set('wujios.volume', v),
          getBrightness: () => Store.get('wujios.brightness', 80),
          setBrightness: v => Store.set('wujios.brightness', v),
          getToggle: k => !!Store.get('wujios.' + k, false),
          setToggle: (k, v) => Store.set('wujios.' + k, v),
          close() { },
          isOpen() { return false; },
        };

      if (!window.PanelSystem) {
        window.PanelSystem = {
          isOpen: false, panel: null,
          open() { }, close() { }, setPanel() { }, init() { },
        };
      }

      /* ============================================================
         AppRuntime
         ============================================================ */
      const AppRuntime = (() => {
        async function ensureLoaded(bundle) {
          let app = WujiApps.get(bundle);
          if (!app) throw new Error('应用未注册: ' + bundle);
          if (app._metaOnly) {
            if (!app._src) throw new Error('缺少 src');
            await WujiAppLoader.load(app._src, app.version);
            app = WujiApps.get(bundle);
          }
          if (!app || app._metaOnly) throw new Error('加载失败: ' + bundle);
          return app;
        }

        function mount(bundle, hostEl, params, opts = {}) {
          const app = WujiApps.get(bundle);
          if (!app) throw new Error('应用不存在: ' + bundle);

          hostEl.innerHTML = '';
          hostEl.style.position = 'relative';
          hostEl.style.overflow = 'hidden';
          hostEl.dataset.wjPlatform = 'zhuzios';

          const shadow = hostEl.attachShadow({ mode: 'open' });

          const baseStyle = document.createElement('style');
          baseStyle.textContent = BASE_CSS;
          shadow.appendChild(baseStyle);

          const compLink = document.createElement('link');
          compLink.rel = 'stylesheet';
          compLink.href = 'styles/components.css';
          shadow.appendChild(compLink);

          const appStyle = document.createElement('style');
          appStyle.textContent = app.styles || '';
          shadow.appendChild(appStyle);

          const navHost = document.createElement('div');
          navHost.style.cssText = 'position:absolute;inset:0;overflow:hidden;';
          shadow.appendChild(navHost);

          const nav = new WujiNavigation({ host: navHost, routes: app.routes || {} });
          // #5 页面级 IME：任意路由切换都收起输入法（zhuzios 无 WJ_IME，这里做防御性判空）。
          if (window.WJ_IME) nav.onChange(() => window.WJ_IME.hide());

          const ctx = {
            closeApp: () => { opts.onClose?.(); },
            onBack(fn) { opts.onBack?.(fn); },
            nav,
            push: (n, d, o) => nav.push(n, d, o),
            pop: (r) => nav.pop(r),
            params: params || {},
          };

          if (app.routes) {
            const initial = app.initialRoute || Object.keys(app.routes)[0];
            nav.push(app.routes[initial], params || {}, { animate: false });
          } else if (typeof app.render === 'function') {
            nav.push({
              name: bundle,
              render: () => `<div class="app-body" id="legacyBody" style="position:absolute;inset:0;overflow-y:auto;padding:16px;"></div>`,
              mount: (el) => {
                const body = el.querySelector('#legacyBody');
                body.innerHTML = app.render ? app.render(ctx) : '';
                try { app.mount?.(body, ctx); } catch (e) { console.error(e); }
              },
              unmount: () => { try { app.unmount?.(); } catch { } },
            }, {}, { animate: false });
          }

          return {
            bundle, nav, hostEl,
            dispatchParams(p) {
              window.dispatchEvent(new CustomEvent('wuji:app-params', {
                detail: { bundle, params: p || {} },
              }));
            },
            destroy() {
              try { nav.destroy(); } catch { }
              try { WujiDialog.closeByBundle?.(bundle); } catch { }
              try { WujiOverlay.closeAll(); } catch { }
              hostEl.innerHTML = '';
            },
          };
        }

        return { ensureLoaded, mount };
      })();

      /* ============================================================
         窗口管理器
         ============================================================ */
      const WujiWindows = (() => {
        const wins = [];
        let zTop = 100;
        let seq = 0;
        const winsLayer = document.getElementById('pcWins');
        const taskItemsEl = document.getElementById('pcTaskItems');
        const taskItemMap = new Map();

        const MIN_W = 320, MIN_H = 220;

        function bindResize(win) {
          const DIRS = ['n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw'];
          const HANDLE_SIZE = 16;      // 触屏/鼠标通用

          DIRS.forEach(dir => {
            const h = document.createElement('div');
            h.className = `pc-win__rz pc-win__rz--${dir}`;
            h.dataset.dir = dir;
            h.style.cssText = `
      position: absolute;
      z-index: 3;
      ${dir.includes('n') ? 'top: -4px; height: 8px;' : ''}
      ${dir.includes('s') ? 'bottom: -4px; height: 8px;' : ''}
      ${dir.includes('w') ? 'left: -4px; width: 8px;' : ''}
      ${dir.includes('e') ? 'right: -4px; width: 8px;' : ''}
      ${dir === 'n' || dir === 's' ? 'left: 8px; right: 8px; cursor: ' + (dir === 'n' ? 'ns' : 'ns') + '-resize;' : ''}
      ${dir === 'e' || dir === 'w' ? 'top: 8px; bottom: 8px; cursor: ' + (dir === 'e' ? 'ew' : 'ew') + '-resize;' : ''}
      ${dir === 'nw' ? 'left: 0; top: 0; width: 16px; height: 16px; cursor: nwse-resize;' : ''}
      ${dir === 'ne' ? 'right: 0; top: 0; width: 16px; height: 16px; cursor: nesw-resize;' : ''}
      ${dir === 'sw' ? 'left: 0; bottom: 0; width: 16px; height: 16px; cursor: nesw-resize;' : ''}
      ${dir === 'se' ? 'right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize;' : ''}
    `;
            h.addEventListener('pointerdown', e => {
              if (win.maximized) return;
              e.preventDefault();
              e.stopPropagation();
              const sx = e.clientX, sy = e.clientY;
              const startL = win.el.offsetLeft;
              const startT = win.el.offsetTop;
              const startW = win.el.offsetWidth;
              const startH = win.el.offsetHeight;
              try { h.setPointerCapture(e.pointerId); } catch { }

              function move(ev) {
                const dx = ev.clientX - sx;
                const dy = ev.clientY - sy;
                let L = startL, T = startT, W = startW, H = startH;

                if (dir.includes('e')) W = Math.max(MIN_W, startW + dx);
                if (dir.includes('s')) H = Math.max(MIN_H, startH + dy);
                if (dir.includes('w')) {
                  W = Math.max(MIN_W, startW - dx);
                  L = startL + (startW - W);
                }
                if (dir.includes('n')) {
                  H = Math.max(MIN_H, startH - dy);
                  T = startT + (startH - H);
                }

                win.el.style.left = L + 'px';
                win.el.style.top = T + 'px';
                win.el.style.width = W + 'px';
                win.el.style.height = H + 'px';
              }
              function end(ev) {
                try { h.releasePointerCapture(ev.pointerId); } catch { }
                h.removeEventListener('pointermove', move);
                h.removeEventListener('pointerup', end);
                h.removeEventListener('pointercancel', end);
              }
              h.addEventListener('pointermove', move);
              h.addEventListener('pointerup', end);
              h.addEventListener('pointercancel', end);
            });
            win.el.appendChild(h);
          });
        }

        const getTaskbarH = () =>
          parseInt(getComputedStyle(document.documentElement).getPropertyValue('--taskbar-h')) || 48;

        function addTaskItem(win) {
          const el = document.createElement('button');
          el.className = 'pc-task-item';
          el.type = 'button';
          el.dataset.winId = String(win.id);
          el.innerHTML = `
        <img src="${win.icon || ''}" alt="">
        <span class="pc-task-item__title">${escapeHtml(win.title)}</span>
      `;
          el.addEventListener('click', () => {
            if (win.minimized) restore(win);
            else if (win.el.classList.contains('is-focused')) minimize(win);
            else focus(win);
          });
          taskItemsEl.appendChild(el);
          taskItemMap.set(win.id, el);
        }
        function removeTaskItem(win) {
          const el = taskItemMap.get(win.id);
          if (el) el.remove();
          taskItemMap.delete(win.id);
        }
        function updateTaskItem(win) {
          const el = taskItemMap.get(win.id);
          if (!el) return;
          el.classList.toggle(
            'is-active',
            win.el.classList.contains('is-focused') && !win.minimized
          );
        }

        async function open(bundle, params = {}) {
          const existing = wins.find(w => w.bundle === bundle);
          if (existing) {
            if (existing.minimized) restore(existing);
            focus(existing);
            if (params && Object.keys(params).length) {
              existing.instance.dispatchParams(params);
            }
            return existing;
          }

          let app;
          try {
            app = await AppRuntime.ensureLoaded(bundle);
          } catch (e) {
            console.error('[open]', bundle, e);

            const rec = window.WujiAppInstaller?.get?.(bundle);
            if (rec && !WujiApps.deviceAllowed(rec)) {
              try { WujiToast?.show?.(`该应用仅支持在iWuji上使用`); } catch { }
            }
            return null;
          }

          const id = ++seq;
          const W = Math.min(660, Math.floor(window.innerWidth * 0.72));
          const H = Math.min(560, Math.floor((window.innerHeight - getTaskbarH()) * 0.78));
          const off = (wins.length % 6) * 26;

          const el = document.createElement('div');
          el.className = 'pc-win';
          el.dataset.winId = String(id);
          el.dataset.bundle = bundle;
          el.style.cssText = `
        left:${Math.max(24, (window.innerWidth - W) / 2 + off)}px;
        top:${Math.max(24, (window.innerHeight - getTaskbarH() - H) / 2 + off)}px;
        width:${W}px;
        height:${H}px;
        z-index:${++zTop};
      `;

          el.innerHTML = `
        <div class="pc-win__titlebar">
          <button class="pc-win__back" type="button" title="返回" style="display:none;"><svg viewBox="0 0 16 16" width="18" height="18" fill="none"
     stroke="currentColor" stroke-width="1.5"
     stroke-linecap="round" stroke-linejoin="round">
  <polyline points="10,3 5,8 10,13"/>
</svg></button>
          <img class="pc-win__icon" src="${escapeHtml(app.icon || '')}" alt="">
          <span class="pc-win__title">${escapeHtml(app.name || bundle)}</span>
          <div class="pc-win__actions">
  <button type="button" data-act="min" title="最小化" aria-label="最小化">
    <svg viewBox="0 0 16 16" width="18" height="18" fill="none"
         stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <line x1="3" y1="8" x2="13" y2="8"/>
    </svg>
  </button>

  <button type="button" data-act="max" title="最大化" aria-label="最大化">
    <svg class="pc-win__ic-max" viewBox="0 0 16 16" width="18" height="18"
         fill="none" stroke="currentColor" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2 9 V14 H7"/>
      <path d="M9 2 H14 V7"/>
    </svg>
    <svg class="pc-win__ic-restore" viewBox="0 0 16 16" width="18" height="18"
         fill="none" stroke="currentColor" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2 9.5 H6.5 V14"/>
      <path d="M9.5 2 V6.5 H14"/>
    </svg>
  </button>

  <button type="button" data-act="close" class="close" title="关闭" aria-label="关闭">
    <svg viewBox="0 0 16 16" width="18" height="18" fill="none"
         stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <line x1="3.5" y1="3.5" x2="12.5" y2="12.5"/>
      <line x1="12.5" y1="3.5" x2="3.5" y2="12.5"/>
    </svg>
  </button>
</div>
        </div>
        <div class="pc-win__body"></div>
      `;
          winsLayer.appendChild(el);

          const win = {
            id, bundle, el,
            bodyEl: el.querySelector('.pc-win__body'),
            title: app.name || bundle,
            icon: app.icon || '',
            minimized: false,
            maximized: false,
            prevRect: null,
            instance: null,
          };

          try {
            win.instance = AppRuntime.mount(bundle, win.bodyEl, params, {
              onClose: () => close(win),
            });
          } catch (e) {
            console.error('[mount]', bundle, e);
            el.remove();
            return null;
          }

          wins.push(win);

          el.querySelector('.pc-win__actions').addEventListener('click', e => {
            const btn = e.target.closest('button[data-act]');
            if (!btn) return;
            const act = btn.dataset.act;
            if (act === 'min') minimize(win);
            else if (act === 'max') toggleMax(win);
            else if (act === 'close') close(win);
          });

          const backBtn = el.querySelector('.pc-win__back');
          backBtn.addEventListener('click', () => {
            if (win.instance.nav.depth > 1) win.instance.nav.pop();
          });
          const offNav = win.instance.nav.onChange(() => {
            backBtn.style.display = win.instance.nav.depth > 1 ? '' : 'none';
          });
          win._offNav = offNav;

          el.addEventListener('pointerdown', () => focus(win), true);

          bindDrag(win);
          bindResize(win);
          bindWindowGesture(win);

          addTaskItem(win);
          focus(win);
          return win;
        }

        function focus(win) {
          if (win.minimized) return;
          win.el.style.zIndex = ++zTop;
          wins.forEach(w => {
            w.el.classList.toggle('is-focused', w === win);
            updateTaskItem(w);
          });
        }

        function close(win) {
          const i = wins.indexOf(win);
          if (i < 0) return;
          wins.splice(i, 1);

          try { win._offNav?.(); } catch { }
          try { win._cleanupGesture?.(); } catch { }
          try { win.instance.destroy(); } catch { }
          win.el.remove();
          removeTaskItem(win);

          const next = wins
            .filter(w => !w.minimized)
            .sort((a, b) => +b.el.style.zIndex - +a.el.style.zIndex)[0];
          if (next) focus(next);
        }

        function minimize(win) {
          win.minimized = true;
          win.el.style.display = 'none';
          updateTaskItem(win);
          const next = wins
            .filter(w => !w.minimized)
            .sort((a, b) => +b.el.style.zIndex - +a.el.style.zIndex)[0];
          if (next) focus(next);
        }
        function restore(win) {
          win.minimized = false;
          win.el.style.display = '';
          updateTaskItem(win);
          focus(win);
        }

        function toggleMax(win) {
          const maxBtn = win.el.querySelector('button[data-act="max"]');

          if (win.maximized) {
            Object.assign(win.el.style, {
              left: win.prevRect.left + 'px',
              top: win.prevRect.top + 'px',
              width: win.prevRect.width + 'px',
              height: win.prevRect.height + 'px',
            });
            win.maximized = false;
          } else {
            win.prevRect = {
              left: win.el.offsetLeft,
              top: win.el.offsetTop,
              width: win.el.offsetWidth,
              height: win.el.offsetHeight,
            };
            Object.assign(win.el.style, {
              left: '0px', top: '0px', width: '100%', height: '100%',
            });
            win.maximized = true;
          }

          if (maxBtn) {
            maxBtn.classList.toggle('is-maximized', win.maximized);
            maxBtn.title = win.maximized ? '还原' : '最大化';
            maxBtn.setAttribute('aria-label', maxBtn.title);
          }

          focus(win);
        }

        function bindDrag(win) {
          const bar = win.el.querySelector('.pc-win__titlebar');
          let dragging = false;
          let sx = 0, sy = 0, sl = 0, st = 0;

          bar.addEventListener('pointerdown', e => {
            if (e.button !== 0) return;
            if (e.target.closest('.pc-win__actions')) return;
            if (e.target.closest('.pc-win__back')) return;
            if (win.maximized) return;
            dragging = true;
            sx = e.clientX; sy = e.clientY;
            sl = win.el.offsetLeft; st = win.el.offsetTop;
            try { bar.setPointerCapture(e.pointerId); } catch { }
          });

          bar.addEventListener('pointermove', e => {
            if (!dragging) return;
            const nl = Math.max(0, Math.min(
              window.innerWidth - win.el.offsetWidth,
              sl + e.clientX - sx
            ));
            const nt = Math.max(0, Math.min(
              window.innerHeight - getTaskbarH() - win.el.offsetHeight,
              st + e.clientY - sy
            ));
            win.el.style.left = nl + 'px';
            win.el.style.top = nt + 'px';
          });

          const end = e => {
            if (!dragging) return;
            dragging = false;
            try { bar.releasePointerCapture(e.pointerId); } catch { }
          };
          bar.addEventListener('pointerup', end);
          bar.addEventListener('pointercancel', end);
        }

        function bindWindowGesture(win) {
          const nav = win.instance.nav;

          function onKey(e) {
            if (!e.altKey || e.key !== 'ArrowLeft') return;
            if (!win.el.classList.contains('is-focused')) return;
            if (nav.depth > 1) { nav.pop(); e.preventDefault(); }
          }
          window.addEventListener('keydown', onKey);

          win._cleanupGesture = () => {
            window.removeEventListener('keydown', onKey);
          };
        }

        return {
          open, close, minimize, restore, toggleMax, focus,
          list: () => wins.slice(),
        };
      })();
      window.WujiWindows = WujiWindows;
      window.WujiAppLauncher = {
        open(bundle, params) {
          WujiWindows.open(bundle, params || {});
        },
        getCurrentBundle() {
          const f = WujiWindows.list().find(w => w.el.classList.contains('is-focused'));
          return f ? f.bundle : null;
        },
        close() {
          const f = WujiWindows.list().find(w => w.el.classList.contains('is-focused'));
          if (f) WujiWindows.close(f);
        },
      };

      const StartMenu = (() => {
        const btn = document.getElementById('pcStartBtn');
        const menu = document.getElementById('pcStartMenu');
        const listEl = document.getElementById('pcStartList');
        const footerEl = menu.querySelector('.pc-start-menu__footer');

        function render() {
          const apps = WujiApps.visible().slice().sort((a, b) => {
            const an = a.name || a.bundlename;
            const bn = b.name || b.bundlename;
            return an.localeCompare(bn, 'zh-Hans-CN');
          });

          if (!apps.length) {
            listEl.innerHTML = '<div class="pc-start-menu__empty">没有应用</div>';
            return;
          }

          listEl.innerHTML = apps.map(app => `
        <button class="pc-start-menu__item" data-bundle="${escapeHtml(app.bundlename)}" type="button">
          <img src="${escapeHtml(app.icon || '')}" alt="">
          <div class="pc-start-menu__item-text">
            <div class="pc-start-menu__item-name">${escapeHtml(app.name || app.bundlename)}</div>
          </div>
        </button>
      `).join('');

          listEl.querySelectorAll('.pc-start-menu__item').forEach(el => {
            el.addEventListener('click', () => {
              const bundle = el.dataset.bundle;
              close();
              WujiWindows.open(bundle);
            });
          });
        }

        function openMenu() {
          render();
          menu.hidden = false;
          btn.classList.add('is-open');
        }
        function close() {
          menu.hidden = true;
          btn.classList.remove('is-open');
        }
        function toggle() {
          if (menu.hidden) openMenu();
          else close();
        }

        btn.addEventListener('click', e => {
          e.stopPropagation();
          toggle();
        });

        document.addEventListener('pointerdown', e => {
          if (menu.hidden) return;
          if (btn.contains(e.target)) return;
          if (menu.contains(e.target)) return;
          close();
        }, true);

        document.addEventListener('keydown', e => {
          if (e.key === 'Escape' && !menu.hidden) close();
        });

        if (footerEl) {
          footerEl.addEventListener('click', e => {
            const b = e.target.closest('.pc-start-menu__sys');
            if (!b) return;
            const action = b.dataset.action;
            close();
            if (action === 'shutdown') {
              window.PowerMenu?.shutdown?.();
            } else if (action === 'restart') {
              window.PowerMenu?.restart?.();
            } else if (action === 'lock') {
              window.PowerMenu?.lock?.();
            }
          });
        }

        return { open: openMenu, close, toggle };
      })();

      const Locker = (() => {
        const overlayEl = document.getElementById('pcLock');
        const formEl = document.getElementById('pcLockForm');
        const inputEl = document.getElementById('pcLockInput');
        const btnEl = document.getElementById('pcLockBtn');
        const welcomeEl = document.getElementById('pcLockWelcome');

        let state = 'unlocked';       // unlocked | locked | welcome

        function hasPassword() {
          return !!Store.get('lock.password', '');
        }

        function renderForm() {
          welcomeEl.hidden = true;
          formEl.hidden = false;

          if (hasPassword()) {
            inputEl.hidden = false;
            inputEl.value = '';
            inputEl.disabled = false;
            btnEl.textContent = '登录';
          } else {
            inputEl.hidden = true;
            inputEl.value = '';
            btnEl.textContent = '登录';
          }
        }

        function focusPrimary() {
          if (state !== 'locked') return;
          if (hasPassword() && !inputEl.hidden) {
            try { inputEl.focus(); } catch { }
          } else {
            try { btnEl.focus(); } catch { }
          }
        }

        function lock() {
          if (state === 'locked' || state === 'welcome') return;
          state = 'locked';
          overlayEl.hidden = false;
          overlayEl.classList.remove('is-hiding', 'is-error');
          renderForm();
          /* 下一帧再 focus；若被 boot 挡住也没关系，外部会再调 focus() */
          requestAnimationFrame(() => focusPrimary());
        }

        function unlock() {
          state = 'welcome';
          formEl.hidden = true;
          welcomeEl.hidden = false;

          setTimeout(() => {
            overlayEl.classList.add('is-hiding');
            setTimeout(() => {
              overlayEl.hidden = true;
              overlayEl.classList.remove('is-hiding');
              state = 'unlocked';
            }, 400);
          }, 900);
        }

        function tryLogin() {
          if (state !== 'locked') return;

          if (!hasPassword()) {
            unlock();
            return;
          }

          const v = inputEl.value;
          if (v === Store.get('lock.password', '')) {
            unlock();
          } else {
            overlayEl.classList.remove('is-error');
            void overlayEl.offsetWidth;
            overlayEl.classList.add('is-error');
            inputEl.value = '';
            try { inputEl.focus(); } catch { }
            if (navigator.vibrate) {
              try { navigator.vibrate([30, 40, 30]); } catch { }
            }
            setTimeout(() => overlayEl.classList.remove('is-error'), 500);
          }
        }

        function forceHide() {
          overlayEl.hidden = true;
          overlayEl.classList.remove('is-hiding', 'is-error');
          state = 'unlocked';
        }

        btnEl.addEventListener('click', tryLogin);
        inputEl.addEventListener('keydown', e => {
          if (e.key === 'Enter') {
            e.preventDefault();
            tryLogin();
          }
        });

        return {
          lock,
          forceHide,
          tryLogin,
          focus: focusPrimary,
          get isLocked() { return state === 'locked' || state === 'welcome'; },
        };
      })();

      /* ============================================================
         关机 / 重启 / 锁定
         ============================================================ */
      const PowerMenu = (() => {
        const overlayEl = document.getElementById('pcPowerOverlay');
        const textEl = document.getElementById('pcPowerText');

        let state = 'running';        // running | shuttingdown | restarting | off

        function setOverlay(text, { spinner = false, off = false } = {}) {
          if (!overlayEl) return;
          overlayEl.hidden = false;
          overlayEl.classList.toggle('is-spin', spinner);
          overlayEl.classList.toggle('is-off', off);
          if (textEl) textEl.textContent = text || '';
          void overlayEl.offsetWidth;
          overlayEl.classList.add('is-show');
        }

        function closeAllUI() {
          try { WujiWindows.list().forEach(w => WujiWindows.close(w)); } catch { }
          try { StartMenu.close(); } catch { }
          try { Flyout.close(); } catch { }
          try { WujiDialog?.close?.(); } catch { }
          try { WujiOverlay?.closeAll?.(); } catch { }
          try { WujiNotification?.hideBanner?.(); } catch { }
        }

        async function shutdown() {
          if (state !== 'running') return;
          state = 'shuttingdown';

          try { Locker.forceHide(); } catch { }
          closeAllUI();
          setOverlay('正在关机…', { spinner: true });

          await new Promise(r => setTimeout(r, 1600));

          try { WujiApps.shutdown(); } catch (e) { console.warn('[shutdown]', e); }

          setOverlay('已关机 · 点击屏幕开机', { off: true });
          state = 'off';
        }

        async function restart() {
          if (state !== 'running') return;
          state = 'restarting';

          try { Locker.forceHide(); } catch { }
          closeAllUI();
          setOverlay('正在重启…', { spinner: true });

          try { WujiApps.shutdown(); } catch (e) { console.warn('[restart]', e); }

          await new Promise(r => setTimeout(r, 1200));

          try { location.reload(); } catch (e) { console.warn('[restart]', e); }
        }

        function lockNow() {
          if (state !== 'running') return;
          closeAllUI();
          Locker.lock();
        }

        /* 已关机状态：点击屏幕开机 */
        document.addEventListener('pointerdown', e => {
          if (state !== 'off') return;
          if (!overlayEl || overlayEl.hidden) return;
          try { location.reload(); } catch { }
        }, true);

        return {
          shutdown,
          restart,
          lock: lockNow,
          get state() { return state; },
        };
      })();

      window.Locker = Locker;
      window.PowerMenu = PowerMenu;

      /* ============================================================
         任务栏时钟
         ============================================================ */
      (function clock() {
        const el = document.getElementById('pcClock');
        function tick() {
          const d = new Date();
          el.textContent =
            `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }
        tick();
        setInterval(tick, 1000);
      })();
      /* ============================================================
         右下角：控制中心 / 通知中心
         ============================================================ */
      const Flyout = (() => {
        const rootEl = document.getElementById('os');
        const flyoutEl = document.getElementById('pcFlyout');
        const wlanBtn = document.getElementById('pcWlanBtn');
        const clockBtn = document.getElementById('pcClock');

        const paneNC = flyoutEl.querySelector('[data-pane="nc"]');
        const paneCC = flyoutEl.querySelector('[data-pane="cc"]');

        const volEl = document.getElementById('pcCcVolume');
        const volValEl = document.getElementById('pcCcVolVal');
        const briEl = document.getElementById('pcCcBrightness');
        const briValEl = document.getElementById('pcCcBriVal');
        const toggleEls = Array.from(flyoutEl.querySelectorAll('.pc-cc__toggle'));

        const ncListEl = document.getElementById('pcNcList');
        const ncEmptyEl = document.getElementById('pcNcEmpty');
        const ncClearBtn = document.getElementById('pcNcClear');

        const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

        let openPane = null;

        /* ---------- 触屏模式 ---------- */
        function applyTouchMode(on) {
          rootEl.classList.toggle('is-touch-mode', !!on);
        }

        /* ---------- 控制中心同步 ---------- */
        function syncControls() {
          const vol = Math.max(0, Math.min(100, Number(Store.get('wujios.volume', 60)) || 0));
          const bri = Math.max(0, Math.min(100, Number(Store.get('wujios.brightness', 80)) || 0));

          volEl.value = vol;
          volValEl.textContent = vol;
          briEl.value = bri;
          briValEl.textContent = bri;

          toggleEls.forEach(btn => {
            btn.classList.toggle(
              'is-on',
              !!Store.get('wujios.' + btn.dataset.key, false)
            );
          });
        }

        /* ---------- 通知列表 ---------- */
        function renderNotifications() {
          const list = WujiNotification.all() || [];

          ncListEl.innerHTML = list.map(n => {
            const app = WujiApps.get(n.bundlename);
            const icon = app && app.icon ? app.icon : '';
            const d = new Date(n.time || Date.now());
            const time =
              `${String(d.getHours()).padStart(2, '0')}:` +
              `${String(d.getMinutes()).padStart(2, '0')}`;

            return `<div class="pc-nc__item"
                         data-bundle="${esc(n.bundlename)}"
                         data-id="${esc(n.id)}">
              <div class="pc-nc__icon">${icon ? `<img src="${esc(icon)}" alt="">` : ''}</div>
              <div class="pc-nc__body">
                <div class="pc-nc__item-head">
                  <span class="pc-nc__item-title">${esc(n.title)}</span>
                  ${n.showtime === false ? '' : `<span class="pc-nc__item-time">${time}</span>`}
                </div>
                <div class="pc-nc__item-content">${esc(n.content)}</div>
              </div>
              <button class="pc-nc__remove" type="button"
                      data-remove="${esc(n.id)}"
                      data-bundle="${esc(n.bundlename)}"
                      aria-label="删除该通知">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2.2" stroke-linecap="round">
                  <line x1="6" y1="6" x2="18" y2="18"/>
                  <line x1="18" y1="6" x2="6" y2="18"/>
                </svg>
              </button>
            </div>`;
          }).join('');

          ncEmptyEl.hidden = list.length > 0;
          ncClearBtn.hidden = list.length === 0;
        }

        /* ---------- 打开 / 关闭 ---------- */
        function openPanel(name) {
          if (!flyoutEl.hidden && openPane === name) { closePanel(); return; }

          openPane = name;
          paneNC.hidden = name !== 'nc';
          paneCC.hidden = name !== 'cc';
          flyoutEl.hidden = false;

          wlanBtn.classList.toggle('is-active', name === 'cc');
          clockBtn.classList.toggle('is-active', name === 'nc');

          if (name === 'cc') syncControls();
          else renderNotifications();
        }

        function closePanel() {
          flyoutEl.hidden = true;
          openPane = null;
          wlanBtn.classList.remove('is-active');
          clockBtn.classList.remove('is-active');
        }

        /* ---------- 事件 ---------- */
        wlanBtn.addEventListener('click', e => {
          e.stopPropagation();
          openPanel('cc');
        });

        clockBtn.addEventListener('click', e => {
          e.stopPropagation();
          openPanel('nc');
        });

        document.addEventListener('pointerdown', e => {
          if (flyoutEl.hidden) return;
          if (flyoutEl.contains(e.target)) return;
          if (wlanBtn.contains(e.target) || clockBtn.contains(e.target)) return;
          closePanel();
        }, true);

        volEl.addEventListener('input', () => {
          const v = Math.max(0, Math.min(100, parseInt(volEl.value, 10) || 0));
          Store.set('wujios.volume', v);
          volValEl.textContent = v;
          try { window.dispatchEvent(new CustomEvent('wuji:cc-volume-change')); } catch { }
        });

        briEl.addEventListener('input', () => {
          const v = Math.max(0, Math.min(100, parseInt(briEl.value, 10) || 0));
          Store.set('wujios.brightness', v);
          briValEl.textContent = v;
        });

        toggleEls.forEach(btn => {
          btn.addEventListener('click', () => {
            const key = btn.dataset.key;
            const cur = !!Store.get('wujios.' + key, false);
            const next = !cur;
            Store.set('wujios.' + key, next);
            btn.classList.toggle('is-on', next);
            if (key === 'touchmode') applyTouchMode(next);
          });
        });

        ncListEl.addEventListener('click', e => {
          const removeBtn = e.target.closest('.pc-nc__remove');
          if (removeBtn) {
            e.stopPropagation();
            e.preventDefault();

            const bundle = removeBtn.dataset.bundle;
            const idStr = removeBtn.dataset.remove;
            const rec = (WujiNotification.all() || [])
              .find(n => n.bundlename === bundle && String(n.id) === idStr);

            try {
              WujiNotification.unpublish({
                bundlename: bundle,
                id: rec ? rec.id : idStr,
              });
            } catch { }

            renderNotifications();
            return;
          }

          const item = e.target.closest('.pc-nc__item');
          if (!item) return;

          const bundle = item.dataset.bundle;
          const id = item.dataset.id;
          const rec = (WujiNotification.all() || [])
            .find(n => n.bundlename === bundle && String(n.id) === String(id));

          closePanel();
          try {
            WujiNotification.unpublish({
              bundlename: bundle,
              id: rec ? rec.id : id,
            });
          } catch { }

          if (bundle && WujiApps.get(bundle)) {
            WujiWindows.open(bundle, (rec && rec.clickparams) || {});
          }
        });

        ncClearBtn.addEventListener('click', () => {
          try { WujiNotification.clearAll(); } catch { }
          renderNotifications();
        });

        /* 初始状态 */
        applyTouchMode(!!Store.get('wujios.touchmode', false));
        syncControls();

        return {
          applyTouchMode,
          syncControls,
          renderNotifications,
          close: closePanel,
          onNotificationsChanged() {
            if (!flyoutEl.hidden && openPane === 'nc') renderNotifications();
          },
        };
      })();

      /* ============================================================
         通知
         ============================================================ */
      const osEl = document.getElementById('os');
      try {
        WujiNotification.init({
          osEl,
          openApp: (bundle, params) => WujiWindows.open(bundle, params || {}),
          bannerInteractive: false,          // ★ 右下角固定横幅：无手势
        });
        WujiNotification.onChange(() => Flyout.onNotificationsChanged());
      } catch (e) { console.warn('[notification]', e); }

      (async () => {
        const bootEl = document.getElementById('pcBoot');
        const startAt = performance.now();

        try {
          if (window.WujiTheme) WujiTheme.init();
          else console.warn('[boot] WujiTheme 未加载，跳过主题初始化');
        } catch (e) { console.warn('[theme]', e); }

        /* registerMeta 内部已按 devices 过滤 */
        BUILTIN_APPS.forEach(meta => WujiApps.registerMeta(meta, 'builtin'));

        try { await WujiAppInstaller.restore(); }
        catch (e) { console.warn('[boot] restore failed', e); }

        /* ★ 内置应用按平台过滤后预加载 */
        BUILTIN_APPS
          .filter(m => WujiApps.deviceAllowed(m))
          .forEach(m => {
            if (!m.src) return;
            WujiAppLoader.load(m.src, m.version).catch(e => {
              console.warn('[preload builtin]', m.bundlename, e);
            });
          });

        /* installeds() 已过滤，天然只含本平台应用 */
        WujiApps.installeds().forEach(app => {
          if (!app._src) return;
          WujiAppLoader.load(app._src, app.version).catch(e => {
            console.warn('[preload installed]', app.bundlename, e);
          });
        });

        try { WujiApps.boot(); }
        catch (e) { console.warn('[boot]', e); }

        const wait = Math.max(0, BOOT_MIN_MS - (performance.now() - startAt));
        setTimeout(() => {
          try { Locker.lock(); } catch (e) { console.warn('[lock]', e); }

          bootEl.classList.add('is-hide');

          setTimeout(() => {
            try { bootEl.remove(); } catch { }
            try { Locker.focus(); } catch { }
          }, 600);
        }, wait);
      })();

      window.addEventListener('beforeunload', () => {
        try { WujiApps.shutdown(); } catch { }
      });
    })();
  </script>

</body>

</html>
